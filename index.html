      /* Minimal tokens */
      :root{--background:0 0% 100%;--foreground:0 0% 7%;--muted:30 20% 96%;--primary:45 100% 35%;--radius:0.75rem}

      /* Trust badges - static */
      .static-trust-badges{display:flex;flex-wrap:wrap;gap:0.5rem;margin-bottom:1.5rem}
      .static-trust-badge{display:inline-flex;align-items:center;gap:0.35rem;padding:0.4rem 0.75rem;border-radius:999px;font-size:0.8rem;font-weight:600}
      .static-trust-badge.green{background:hsl(142 70% 90%);color:hsl(142 70% 30%);border:1px solid hsl(142 60% 80%)}
      .static-trust-badge.gold{background:hsl(45 90% 90%);color:hsl(45 90% 30%);border:1px solid hsl(45 80% 75%)}
      .static-trust-badge.blue{background:hsl(210 80% 92%);color:hsl(210 80% 35%);border:1px solid hsl(210 60% 80%)}
      .static-trust-badge svg{width:14px;height:14px;flex-shrink:0}
      
      /* Static booking card - real content, not skeleton */
      .static-booking-card{width:100%;max-width:28rem;background:white;border-radius:1rem;box-shadow:0 4px 24px -4px rgba(0,0,0,0.12);overflow:hidden;border:1px solid hsl(30 20% 90%)}
      .static-booking-tabs{display:flex;background:hsl(30 20% 96%);border-bottom:1px solid hsl(30 20% 90%)}
      .static-booking-tab{flex:1;padding:0.875rem 1rem;font-size:0.875rem;font-weight:600;display:flex;align-items:center;justify-content:center;gap:0.5rem;color:hsl(0 0% 45%);background:transparent;border:none;cursor:pointer}
      .static-booking-tab.active{background:white;color:hsl(var(--primary));box-shadow:0 -2px 0 hsl(var(--primary)) inset}
      .static-booking-tab svg{width:16px;height:16px}
      .static-booking-form{padding:1.25rem}
      .static-input{width:100%;padding:0.875rem 1rem;border:1px solid hsl(30 20% 88%);border-radius:0.75rem;font-size:0.9375rem;color:hsl(0 0% 25%);background:hsl(30 20% 99%);margin-bottom:0.75rem}
      .static-input::placeholder{color:hsl(0 0% 55%)}
      .static-input-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.5rem;margin-bottom:0.75rem}
      .static-input-row .static-input{margin-bottom:0}
      .static-cta{width:100%;padding:1rem;background:hsl(var(--primary));color:white;font-size:1rem;font-weight:700;border:none;border-radius:0.75rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:0.5rem;text-decoration:none;margin-top:0.5rem}
      .static-cta:hover{filter:brightness(1.05)}
      .static-cta svg{width:18px;height:18px}
      
      /* Hide static hero when React mounts */
      .js-loaded .static-hero{display:none}
      
      /* Font swap - prevent FOUT */
      .fonts-loaded body{font-family:'Inter',system-ui,sans-serif}
      .fonts-loaded h1,.fonts-loaded h2,.fonts-loaded h3{font-family:'Playfair Display',Georgia,serif}

      noscript .noscript-hero p{max-width:32rem;color:hsl(0 0% 35%);margin-bottom:1.5rem}
      noscript .noscript-cta{display:inline-flex;padding:0.875rem 1.75rem;background:hsl(var(--primary));color:white;text-decoration:none;font-weight:600;border-radius:0.75rem}

    <script>

    <!-- Boot recovery watchdog (no cache wording) -->
    <script>
      (function () {
        var SHOWN_KEY = "boot_recovery_shown";
        var shown = false;

        // If the app mounts AFTER this overlay is shown (slow connection / heavy device),
        // auto-dismiss it so the page doesn't stay blocked.
        var overlayEl = null;
        var dismissInterval = null;
        var DISMISS_EVENT = "lovable:app-mounted";

        // Capture early boot errors (resource load failures, JS runtime errors)
        // so we can diagnose cases where React never mounts on production.
        var bootErrors = [];
        function pushBootError(entry) {
          try {
            if (!entry) return;
            bootErrors.push(entry);
            if (bootErrors.length > 20) bootErrors.shift();
            try {
              window.__BOOT_ERRORS__ = bootErrors;
            } catch (e) {}
          } catch (e) {}
        }

        function getDebugReport() {
          var lines = [];
          try {
            lines.push("URL: " + String(window.location.href));
          } catch (e) {}
          try {
            lines.push("UA: " + String(navigator.userAgent));
          } catch (e) {}
          try {
            lines.push("Time: " + new Date().toISOString());
          } catch (e) {}
          lines.push("Errors: " + String(bootErrors.length));
          lines.push("---");

          for (var i = 0; i < bootErrors.length; i++) {
            try {
              var e = bootErrors[i];
              lines.push("#" + (i + 1) + " " + (e.type || "error"));
              if (e.url) lines.push("url: " + e.url);
              if (e.tag) lines.push("tag: " + e.tag);
              if (e.message) lines.push("message: " + e.message);
              if (e.filename) lines.push("file: " + e.filename);
              if (e.lineno != null) lines.push("line: " + e.lineno + ":" + e.colno);
              if (e.stack) lines.push("stack: " + e.stack);
              lines.push("---");
            } catch (err) {}
          }

          // Extra hint: list last few resource URLs we attempted to load.
          try {
            if (window.performance && performance.getEntriesByType) {
              var res = performance.getEntriesByType("resource");
              var tail = res.slice(Math.max(0, res.length - 15));
              lines.push("Resources (last " + tail.length + "):");
              for (var j = 0; j < tail.length; j++) {
                try {
                  var r = tail[j];
                  if (r && r.name) lines.push("- " + r.name);
                } catch (e2) {}
              }
            }
          } catch (e) {}

          return lines.join("\n");
        }

        try {
          window.addEventListener(
            "error",
            function (event) {
              try {
                // Resource loading error (script/link/img)
                var t = event && event.target;
                var tag = t && t.tagName ? String(t.tagName).toLowerCase() : null;
                var url = null;
                try {
                  url = t && (t.src || t.href) ? String(t.src || t.href) : null;
                } catch (e) {}

                if (tag && url) {
                  pushBootError({ type: "resource", tag: tag, url: url });
                  return;
                }

                // JS runtime error
                pushBootError({
                  type: "runtime",
                  message: event && event.message ? String(event.message) : "Unknown error",
                  filename: event && event.filename ? String(event.filename) : null,
                  lineno: event && event.lineno != null ? event.lineno : null,
                  colno: event && event.colno != null ? event.colno : null,
                  stack: event && event.error && event.error.stack ? String(event.error.stack) : null,
                });
              } catch (e) {}
            },
            true
          );
        } catch (e) {}

        try {
          window.addEventListener("unhandledrejection", function (event) {
            try {
              var reason = event && event.reason;
              pushBootError({
                type: "unhandledrejection",
                message: reason && reason.message ? String(reason.message) : String(reason || "Unknown rejection"),
                stack: reason && reason.stack ? String(reason.stack) : null,
              });
            } catch (e) {}
          });
        } catch (e) {}

        function removeOverlay() {
          try {
            if (dismissInterval) {
              clearInterval(dismissInterval);
              dismissInterval = null;
            }
          } catch (e) {}

          try {
            if (overlayEl && overlayEl.parentNode) overlayEl.parentNode.removeChild(overlayEl);
          } catch (e) {}

          overlayEl = null;
        }

        function scheduleAutoDismiss() {
          // Event-based dismissal (fast path)
          try {
            window.addEventListener(
              DISMISS_EVENT,
              function () {
                removeOverlay();
              },
              { once: true }
            );
          } catch (e) {}

          // Flag-based fallback (covers cases where only __APP_MOUNTED__ is set)
          try {
            var startedAt = Date.now();
            dismissInterval = setInterval(function () {
              try {
                if (window.__APP_MOUNTED__) {
                  removeOverlay();
                  return;
                }
              } catch (e) {}

              if (Date.now() - startedAt > 30000) {
                try {
                  clearInterval(dismissInterval);
                } catch (e) {}
                dismissInterval = null;
              }
            }, 250);
          } catch (e) {}
        }

        function safeSessionGet(key) {
          try {
            return sessionStorage.getItem(key);
          } catch (e) {
            return null;
          }
        }

        function safeSessionSet(key, value) {
          try {
            sessionStorage.setItem(key, value);
          } catch (e) {
            // ignore
          }
        }

        function createButton(label) {
          var btn = document.createElement("button");
          btn.textContent = label;
          btn.style.cssText =
            "appearance:none;border:0;border-radius:12px;padding:12px 14px;font-weight:600;cursor:pointer;" +
            "background:hsl(var(--foreground));color:hsl(var(--background));";
          return btn;
        }

        function createGhostButton(label) {
          var btn = document.createElement("button");
          btn.textContent = label;
          btn.style.cssText =
            "appearance:none;border:1px solid hsl(var(--foreground) / 0.2);border-radius:12px;padding:12px 14px;" +
            "font-weight:600;cursor:pointer;background:transparent;color:hsl(var(--foreground));";
          return btn;
        }

        async function hardRecover() {
          // No user-facing cache wording; only a best-effort recovery for stale PWA assets.
          try {
            if ("serviceWorker" in navigator) {
              var regs = await navigator.serviceWorker.getRegistrations();
              await Promise.all(regs.map(function (r) { return r.unregister(); }));
            }
          } catch (e) {}

          try {
            if ("caches" in window) {
              var names = await caches.keys();
              await Promise.all(names.map(function (n) { return caches.delete(n); }));
            }
          } catch (e) {}

          var base = window.location.href.split("?")[0];
          window.location.href = base + "?_t=" + Date.now();
        }

        function showOverlay() {
          if (shown) return;
          shown = true;
          safeSessionSet(SHOWN_KEY, "1");

          var overlay = document.createElement("div");
          overlay.id = "boot-recovery";
          // Non-blocking: don't cover the whole page; show as a bottom sheet so it can't "trap" users.
          overlay.style.cssText =
            "position:fixed;left:12px;right:12px;bottom:12px;z-index:2147483647;display:flex;align-items:flex-end;justify-content:center;" +
            "pointer-events:none;";

          var card = document.createElement("div");
          card.style.cssText =
            "width:min(520px, 100%);border-radius:16px;border:1px solid hsl(var(--foreground) / 0.12);" +
            "background:hsl(var(--background));box-shadow:0 20px 60px -20px rgba(0,0,0,0.25);padding:18px;pointer-events:auto;";

          var title = document.createElement("div");
          title.textContent = "Sayfa yüklenemedi";
          title.style.cssText = "font-weight:700;font-size:18px;color:hsl(var(--foreground));";

          var desc = document.createElement("div");
          desc.textContent = "Bağlantı veya güncelleme nedeniyle açılış uzadı. Aşağıdan yeniden deneyebilirsiniz.";
          desc.style.cssText = "margin-top:6px;font-size:13px;color:hsl(var(--foreground) / 0.72);line-height:1.45;";

          var actions = document.createElement("div");
          actions.style.cssText = "display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;";

          var retry = createGhostButton("Tekrar Dene");
          retry.onclick = function () {
            window.location.reload();
          };

          var fix = createButton("Sert Yenile");
          fix.onclick = function () {
            hardRecover();
          };

          var copy = createGhostButton("Detayları Kopyala");
          copy.onclick = function () {
            var text = "";
            try {
              text = getDebugReport();
            } catch (e) {
              text = "Debug report unavailable";
            }

            try {
              if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text);
              } else {
                window.prompt("Kopyalayın:", text);
              }
            } catch (e) {
              try {
                window.prompt("Kopyalayın:", text);
              } catch (e2) {}
            }
          };

          actions.appendChild(retry);
          actions.appendChild(fix);
          actions.appendChild(copy);

          var details = document.createElement("details");
          details.style.cssText = "margin-top:12px;border:1px solid hsl(var(--foreground) / 0.12);border-radius:12px;padding:10px;";

          var summary = document.createElement("summary");
          summary.textContent = "Teknik detaylar";
          summary.style.cssText = "cursor:pointer;font-weight:600;color:hsl(var(--foreground) / 0.85);";

          var pre = document.createElement("pre");
          pre.textContent = getDebugReport();
          pre.style.cssText = "margin-top:10px;white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.4;color:hsl(var(--foreground) / 0.78);max-height:220px;overflow:auto;";

          details.appendChild(summary);
          details.appendChild(pre);

          card.appendChild(title);
          card.appendChild(desc);
          card.appendChild(actions);
          card.appendChild(details);
          overlay.appendChild(card);
          document.body.appendChild(overlay);

          overlayEl = overlay;
          scheduleAutoDismiss();
        }

        // Avoid showing multiple times in the same session.
        if (safeSessionGet(SHOWN_KEY)) return;

        setTimeout(function () {
          try {
            if (window.__APP_MOUNTED__) return;
          } catch (e) {}
          showOverlay();
        }, 9000);
      })();
    </script>
