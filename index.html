    <style>
      /* Design System Tokens - Matching src/index.css */
      :root {
        --background: 0 0% 100%;
        --foreground: 0 0% 7%;
        --primary: 0 0% 7%;
        --primary-foreground: 0 0% 100%;
        --secondary: 30 33% 93%;
        --accent: 49 97% 60%;
        --muted: 30 20% 96%;
        --muted-foreground: 0 0% 40%;
        --border: 30 20% 88%;
        --radius: 0.75rem;
        --gold: 49 97% 60%;
        --cream: 30 33% 93%;
      }
      
      /* Critical Reset */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      
      /* Base Styles */
      html { 
        -webkit-font-smoothing: antialiased; 
        -moz-osx-font-smoothing: grayscale;
        scroll-behavior: smooth;
      }
      body { 
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
        background: hsl(var(--background)); 
        color: hsl(var(--foreground));
        line-height: 1.5;
      }
      
      /* App Container */
      #root { min-height: 100vh; min-height: 100dvh; }
      
      /* Hero Section - Above the fold */
      .hero-loading { 
        position: relative;
        background: linear-gradient(135deg, hsl(0 0% 7%) 0%, hsl(0 0% 12%) 50%, hsl(0 0% 7%) 100%); 
        min-height: 70vh;
        min-height: 70dvh;
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        justify-content: center; 
        text-align: center; 
        padding: 4rem 1rem;
        overflow: hidden;
      }
      
      /* Hero Typography */
      .hero-loading h1 { 
        font-family: 'Playfair Display', Georgia, serif;
        font-size: clamp(2rem, 5vw, 4.5rem); 
        font-weight: 700; 
        margin: 0 0 1rem 0; 
        line-height: 1.1;
        color: white;
        letter-spacing: -0.02em;
      }
      .hero-loading .hero-subtitle { 
        font-size: clamp(1rem, 2vw, 1.25rem); 
        opacity: 0.9; 
        margin: 0; 
        max-width: 42rem;
        line-height: 1.625;
        color: hsl(0 0% 85%);
      }
      
      /* Gold accent for keywords */
      .hero-loading .text-gold {
        color: hsl(var(--gold));
      }
      
      /* Skeleton loading animation */
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      .skeleton {
        background: linear-gradient(90deg, hsl(0 0% 15%) 25%, hsl(0 0% 20%) 50%, hsl(0 0% 15%) 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
        border-radius: var(--radius);
      }
      
      /* Form skeleton placeholder */
      .form-skeleton {
        width: 100%;
        max-width: 28rem;
        height: 320px;
        margin-top: 2rem;
      }
      
      /* Trust bar skeleton */
      .trust-skeleton {
        display: flex;
        gap: 2rem;
        justify-content: center;
        margin-top: 2rem;
        flex-wrap: wrap;
      }
      .trust-skeleton-item {
        width: 80px;
        height: 24px;
      }
      
      /* Fade-in for hydration */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .fade-in {
        animation: fadeIn 0.3s ease-out forwards;
      }
      
      /* Layout utilities used immediately */
      .flex { display: flex; }
      .flex-col { flex-direction: column; }
      .items-center { align-items: center; }
      .justify-center { justify-content: center; }
      .gap-4 { gap: 1rem; }
      .w-full { width: 100%; }
      .text-center { text-align: center; }
      
      /* Hide content until JS loads */
      .js-loading { opacity: 0; }
      .js-loaded .js-loading { opacity: 1; transition: opacity 0.3s ease; }
      
      /* Responsive adjustments */
      @media (min-width: 768px) { 
        .hero-loading { padding: 6rem 2rem; }
      }
      @media (min-width: 1024px) { 
        .hero-loading { min-height: 75vh; min-height: 75dvh; }
      }
      
      /* Prevent layout shift for images */
      img { max-width: 100%; height: auto; }
      
      /* Prevent FOUT (Flash of Unstyled Text) */
      .font-loading h1, .font-loading h2, .font-loading h3, 
      .font-loading h4, .font-loading h5, .font-loading h6 {
        font-family: Georgia, serif;
      }
    </style>
