    <script>
      // Async CSS loader for non-render-blocking styles
      (function() {
        var cssLoaded = false;
        function loadCSS() {
          if (cssLoaded) return;
          cssLoaded = true;
          // CSS will be injected by Vite, this ensures it loads async
          document.documentElement.classList.add('css-ready');
        }
        // Load CSS after first paint
        if ('requestIdleCallback' in window) {
          requestIdleCallback(loadCSS, { timeout: 100 });
        } else {
          setTimeout(loadCSS, 0);
        }
      })();
    </script>

    <script>
      // Boot recovery watchdog:
      // If the React bundle fails to load/hydrate (stuck on hero skeleton), show a recovery overlay.
      (function () {
        var TIMEOUT_MS = 8000;
        function showRecovery() {
          try {
            if (window.__APP_MOUNTED__) return;
            var root = document.getElementById('root');
            if (!root) return;
            if (!root.querySelector || !root.querySelector('.hero-loading')) return;

            // Avoid duplicates
            if (document.getElementById('boot-recovery')) return;

            var overlay = document.createElement('div');
            overlay.id = 'boot-recovery';
            overlay.setAttribute('role', 'dialog');
            overlay.setAttribute('aria-live', 'polite');
            overlay.style.position = 'fixed';
            overlay.style.inset = '0';

            card.style.width = '100%';
            card.style.maxWidth = '420px';
            card.style.borderRadius = '16px';
            card.style.background = 'hsl(0 0% 100%)';
            card.style.color = 'hsl(0 0% 7%)';
            card.style.boxShadow = '0 18px 60px -18px hsl(0 0% 0% / 0.35)';
            card.style.padding = '18px 18px 16px';

            var title = document.createElement('div');
            title.style.fontWeight = '700';
            title.style.fontSize = '16px';
            title.style.marginBottom = '6px';
            title.textContent = 'Uygulama açılmadı (yükleme takıldı)';

            var desc = document.createElement('div');
            desc.style.fontSize = '13px';
            desc.style.color = 'hsl(0 0% 35%)';
            desc.style.marginBottom = '14px';
            desc.textContent = 'Genelde eski PWA önbelleği veya yarım kalan güncelleme yüzünden olur. Aşağıdaki seçeneklerden birini deneyin.';

            var btnRow = document.createElement('div');
            btnRow.style.display = 'flex';
            btnRow.style.gap = '10px';

            function mkBtn(label, filled) {
              var b = document.createElement('button');
              b.type = 'button';
              b.textContent = label;
              b.style.flex = '1';
              b.style.height = '42px';
              b.style.borderRadius = '12px';
              b.style.fontSize = '14px';
              b.style.fontWeight = '600';
              b.style.cursor = 'pointer';
              b.style.border = filled ? '1px solid hsl(0 0% 7%)' : '1px solid hsl(0 0% 82%)';
              b.style.background = filled ? 'hsl(0 0% 7%)' : 'hsl(0 0% 100%)';
              b.style.color = filled ? 'hsl(0 0% 100%)' : 'hsl(0 0% 7%)';
              return b;
            }

            var retryBtn = mkBtn('Tekrar dene', false);
            retryBtn.onclick = function () {
              try { window.location.reload(); } catch (e) {}
            };

            var clearBtn = mkBtn('Önbelleği temizle', true);
            clearBtn.onclick = function () {
              clearBtn.disabled = true;
              clearBtn.textContent = 'Temizleniyor...';

              var tasks = [];
              try {
                if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
                  tasks.push(
                    navigator.serviceWorker.getRegistrations().then(function (regs) {
                      return Promise.all(regs.map(function (r) { return r.unregister(); }));
                    })
                  );
                }
              } catch (e) {}

              try {
                if ('caches' in window && caches.keys) {
                  tasks.push(
                    caches.keys().then(function (keys) {
                      return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                    })
                  );
                }
              } catch (e) {}

              Promise.all(tasks).finally(function () {
                try {
                  var base = window.location.href.split('?')[0];
                  window.location.href = base + '?_t=' + Date.now();
                } catch (e) {
                  window.location.reload();
                }
              });
            };

            btnRow.appendChild(retryBtn);
            btnRow.appendChild(clearBtn);

            card.appendChild(title);
            card.appendChild(desc);
            card.appendChild(btnRow);
            overlay.appendChild(card);
            document.body.appendChild(overlay);
          } catch (e) {
            // ignore
          }
        }

        window.setTimeout(showRecovery, TIMEOUT_MS);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>

  </body>
</html>
