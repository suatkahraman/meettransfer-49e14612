<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Black Mercedes Maybach Rear Interior with Screens">
  <defs>
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111;stop-opacity:1" />
    </linearGradient>
    <filter id="screenLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="#e2e8f0"/>
  
  <!-- Car Interior Frame -->
  <path d="M50,100 L750,100 L750,550 L50,550 Z" fill="#333"/>
  <rect x="50" y="100" width="700" height="450" fill="#1f2937"/>
  
  <!-- Front Seat Backs -->
  <path d="M100,200 L300,200 L320,550 L80,550 Z" fill="#2d2d2d"/> <!-- Left Seat Back -->
  <path d="M500,200 L700,200 L720,550 L480,550 Z" fill="#2d2d2d"/> <!-- Right Seat Back -->
  
  <!-- Entertainment Screens -->
  <rect x="130" y="220" width="140" height="90" rx="5" fill="url(#screenGradient)" stroke="#444" stroke-width="2"/>
  <rect x="530" y="220" width="140" height="90" rx="5" fill="url(#screenGradient)" stroke="#444" stroke-width="2"/>
  
  <!-- Screen Content -->
  <text x="200" y="270" font-family="Arial" font-size="14" fill="#3b82f6" text-anchor="middle" filter="url(#screenLight)">MAYBACH</text>
  <text x="600" y="270" font-family="Arial" font-size="14" fill="#3b82f6" text-anchor="middle" filter="url(#screenLight)">MAYBACH</text>
  
  <!-- Legrests (Extended) -->
  <path d="M150,450 L250,450 L270,550 L130,550 Z" fill="#fefce8" opacity="0.9"/>
  <path d="M550,450 L650,450 L670,550 L530,550 Z" fill="#fefce8" opacity="0.9"/>
  
  <!-- Center Console Rear Vents -->
  <rect x="350" y="400" width="100" height="150" fill="#111" stroke="#451a03"/>
  <rect x="360" y="410" width="80" height="30" fill="#222"/> <!-- AC Vents -->
  <circle cx="380" cy="480" r="10" fill="#ccc"/> <!-- Controls -->
  <circle cx="420" cy="480" r="10" fill="#ccc"/>
  
  <!-- Ambient Light -->
  <rect x="50" y="540" width="700" height="10" fill="#a855f7" opacity="0.5" filter="url(#screenLight)"/>
</svg>