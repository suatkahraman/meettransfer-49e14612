<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Black Mercedes Maybach Rear Exterior">
  <defs>
    <linearGradient id="maybachRear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#020617;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="#f1f5f9"/>
  
  <!-- Maybach Rear Body -->
  <path d="M150,150 L650,150 L650,500 L150,500 Z" fill="url(#maybachRear)"/>
  
  <!-- Rear Window -->
  <path d="M200,180 L600,180 L600,320 L200,320 Z" fill="#000" opacity="0.95"/>
  
  <!-- Chrome Trim -->
  <path d="M150,330 L650,330" stroke="#ccc" stroke-width="2"/>
  
  <!-- Taillights (Sleek LED) -->
  <path d="M150,320 L200,320 L200,450 L150,450 Z" fill="#991b1b" stroke="#333"/>
  <path d="M600,320 L650,320 L650,450 L600,450 Z" fill="#991b1b" stroke="#333"/>
  
  <!-- License Plate Area -->
  <rect x="300" y="400" width="200" height="50" rx="5" fill="#111"/>
  <rect x="310" y="410" width="180" height="30" fill="#fff"/>
  <text x="360" y="430" font-family="Arial" font-size="14" fill="#000">S-CLASS</text>
  
  <!-- Mercedes Logo -->
  <circle cx="400" cy="360" r="20" fill="none" stroke="#ccc" stroke-width="3"/>
  <path d="M400,340 L400,380 M385,355 L415,365 M415,355 L385,365" stroke="#ccc" stroke-width="2"/>
  
  <!-- Chrome Exhaust Tips -->
  <rect x="180" y="480" width="60" height="20" rx="5" fill="#ccc" stroke="#999"/>
  <rect x="560" y="480" width="60" height="20" rx="5" fill="#ccc" stroke="#999"/>
  <path d="M180,490 L240,490 M560,490 L620,490" stroke="#666" stroke-width="1"/>
  
  <!-- Maybach Lettering -->
  <text x="200" y="340" font-family="Times New Roman" font-size="12" fill="#ccc" font-style="italic">Maybach</text>
</svg>