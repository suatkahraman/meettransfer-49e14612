<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Black Mercedes Vito Interior">
  <defs>
    <linearGradient id="leatherBlack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#222;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="#cbd5e1"/>
  
  <!-- Interior Frame -->
  <rect x="50" y="50" width="700" height="500" fill="#e2e8f0"/>
  
  <!-- Captain Seats -->
  <path d="M150,200 L300,200 L300,500 L150,500 Z" fill="url(#leatherBlack)"/>
  <path d="M500,200 L650,200 L650,500 L500,500 Z" fill="url(#leatherBlack)"/>
  
  <!-- Armrests -->
  <rect x="130" y="350" width="40" height="100" rx="5" fill="#111"/>
  <rect x="300" y="350" width="40" height="100" rx="5" fill="#111"/>
  <rect x="480" y="350" width="40" height="100" rx="5" fill="#111"/>
  <rect x="650" y="350" width="40" height="100" rx="5" fill="#111"/>
  
  <!-- Headrests -->
  <rect x="170" y="150" width="110" height="60" rx="10" fill="#111"/>
  <rect x="520" y="150" width="110" height="60" rx="10" fill="#111"/>
  
  <!-- Floor -->
  <rect x="50" y="500" width="700" height="50" fill="#333"/>
</svg>