<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Black Mercedes Vito Exterior Side View">
  <defs>
    <linearGradient id="vitoBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2c2c2c;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="vitoGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a202c;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#2d3748;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="600" fill="#f8fafc"/>
  
  <!-- Van Body -->
  <path d="M100,350 L150,250 L650,250 L700,350 L700,450 L100,450 Z" fill="url(#vitoBody)"/>
  
  <!-- Windows -->
  <path d="M170,260 L300,260 L300,340 L160,340 Z" fill="url(#vitoGlass)"/>
  <path d="M320,260 L480,260 L480,340 L320,340 Z" fill="url(#vitoGlass)"/>
  <path d="M500,260 L630,260 L640,340 L500,340 Z" fill="url(#vitoGlass)"/>
  
  <!-- Wheels -->
  <circle cx="200" cy="450" r="45" fill="#333" stroke="#000" stroke-width="5"/>
  <circle cx="600" cy="450" r="45" fill="#333" stroke="#000" stroke-width="5"/>
  <circle cx="200" cy="450" r="25" fill="#666"/>
  <circle cx="600" cy="450" r="25" fill="#666"/>
  
  <!-- Door Handle -->
  <rect x="330" y="360" width="40" height="10" fill="#333"/>
  <rect x="510" y="360" width="40" height="10" fill="#333"/>
  
  <!-- Headlights -->
  <path d="M680,380 L700,380 L695,400 L680,400 Z" fill="#e2e8f0"/>
  <path d="M100,380 L120,380 L125,400 L105,400 Z" fill="#ef4444"/>
</svg>