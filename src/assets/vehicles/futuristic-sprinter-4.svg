<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Black Mercedes Sprinter Rear Interior View">
  <defs>
    <linearGradient id="luggageSpace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#333;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="#e2e8f0"/>
  
  <!-- Sprinter High Roof Interior -->
  <rect x="50" y="50" width="700" height="500" fill="#1f2937"/>
  
  <!-- Back Row Seats (4 Seats) -->
  <path d="M100,300 L250,300 L250,550 L100,550 Z" fill="#222"/>
  <path d="M260,300 L410,300 L410,550 L260,550 Z" fill="#222"/>
  <path d="M420,300 L570,300 L570,550 L420,550 Z" fill="#222"/>
  <path d="M580,300 L730,300 L730,550 L580,550 Z" fill="#222"/>
  
  <!-- Headrests -->
  <rect x="120" y="250" width="80" height="50" rx="5" fill="#111"/>
  <rect x="280" y="250" width="80" height="50" rx="5" fill="#111"/>
  <rect x="440" y="250" width="80" height="50" rx="5" fill="#111"/>
  <rect x="600" y="250" width="80" height="50" rx="5" fill="#111"/>
  
  <!-- Overhead Storage Bins -->
  <rect x="50" y="50" width="700" height="80" fill="#222" stroke="#444"/>
  <rect x="50" y="100" width="700" height="5" fill="#444"/> <!-- Handle Strip -->
  
  <!-- Aisle View -->
  <path d="M350,550 L450,550 L400,300 Z" fill="#3e2723" opacity="0.5"/>
  
  <!-- Rear Window View -->
  <rect x="200" y="150" width="400" height="80" fill="#94a3b8"/>
</svg>