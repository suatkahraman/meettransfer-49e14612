<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Mercedes Sprinter Airport Transfer Service with Luggage">
  <title>Mercedes Sprinter Airport Transfer Service</title>
  <desc>Professional Mercedes Sprinter minibus at airport with spacious luggage compartment and premium service</desc>
  
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="sprinterAirport" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="sprinterLuggage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#374151;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4b5563;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6b7280;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="sprinterRunway" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    
    <filter id="sprinterServiceGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="#0f172a"/>
  
  <!-- Airport runway background -->
  <rect x="0" y="600" width="1200" height="200" fill="url(#sprinterRunway)"/>
  <path d="M0,650 L1200,650" stroke="#374151" stroke-width="3" stroke-dasharray="50,30"/>
  <path d="M0,700 L1200,700" stroke="#374151" stroke-width="3" stroke-dasharray="50,30"/>
  
  <!-- Mercedes Sprinter at Airport -->
  <g transform="translate(200,300)">
    <!-- Main vehicle -->
    <rect x="0" y="100" width="700" height="220" rx="25" fill="#1f2937" stroke="#374151" stroke-width="3"/>
    <rect x="0" y="90" width="160" height="240" rx="30" fill="#1f2937" stroke="#374151" stroke-width="3"/>
    
    <!-- Extended passenger section -->
    <rect x="500" y="110" width="200" height="200" rx="20" fill="#1f2937" stroke="#374151" stroke-width="2"/>
    
    <!-- Airport service livery -->
    <rect x="100" y="120" width="500" height="40" rx="10" fill="url(#sprinterAirport)" stroke="#60a5fa" stroke-width="2"/>
    <text x="350" y="145" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#ffffff">HAVAALANI TRANSFER</text>
    
    <!-- Windows -->
    <polygon points="20,120 140,120 150,190 10,190" fill="#4b5563" stroke="#2563eb" stroke-width="2"/>
    <rect x="180" y="140" width="70" height="90" fill="#4b5563" stroke="#2563eb" stroke-width="2"/>
    <rect x="270" y="140" width="70" height="90" fill="#4b5563" stroke="#2563eb" stroke-width="2"/>
    <rect x="360" y="140" width="70" height="90" fill="#4b5563" stroke="#2563eb" stroke-width="2"/>
    <rect x="450" y="140" width="70" height="90" fill="#4b5563" stroke="#2563eb" stroke-width="2"/>
    <rect x="540" y="140" width="70" height="90" fill="#4b5563" stroke="#2563eb" stroke-width="2"/>
    <rect x="630" y="140" width="70" height="90" fill="#4b5563" stroke="#2563eb" stroke-width="2"/>
    
    <!-- LED headlights -->
    <circle cx="50" cy="170" r="18" fill="#60a5fa" filter="url(#sprinterServiceGlow)"/>
    <circle cx="120" cy="170" r="18" fill="#60a5fa" filter="url(#sprinterServiceGlow)"/>
    
    <!-- Wheels -->
    <circle cx="140" cy="340" r="40" fill="#111827" stroke="#374151" stroke-width="4"/>
    <circle cx="340" cy="340" r="40" fill="#111827" stroke="#374151" stroke-width="4"/>
    <circle cx="540" cy="340" r="40" fill="#111827" stroke="#374151" stroke-width="4"/>
    
    <!-- Mercedes emblem -->
    <circle cx="80" cy="150" r="15" fill="#e5e7eb"/>
    <path d="M80,135 L80,165 M65,150 L95,150" stroke="#1f2937" stroke-width="3"/>
  </g>
  
  <!-- Luggage compartment -->
  <g transform="translate(250,450)">
    <rect x="0" y="0" width="600" height="120" rx="15" fill="url(#sprinterLuggage)" stroke="#6b7280" stroke-width="2"/>
    <rect x="20" y="20" width="120" height="80" rx="8" fill="#374151" stroke="#6b7280" stroke-width="1"/>
    <rect x="160" y="20" width="120" height="80" rx="8" fill="#374151" stroke="#6b7280" stroke-width="1"/>
    <rect x="300" y="20" width="120" height="80" rx="8" fill="#374151" stroke="#6b7280" stroke-width="1"/>
    <rect x="440" y="20" width="120" height="80" rx="8" fill="#374151" stroke="#6b7280" stroke-width="1"/>
    <text x="300" y="110" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">GENİŞ BAGAJ ALANI</text>
  </g>
  
  <!-- Airport terminal silhouette -->
  <g transform="translate(50,100)" opacity="0.6">
    <rect x="0" y="400" width="300" height="200" fill="#1f2937" stroke="#374151" stroke-width="2"/>
    <rect x="50" y="350" width="50" height="50" fill="#4b5563"/>
    <rect x="130" y="320" width="50" height="80" fill="#4b5563"/>
    <rect x="210" y="340" width="50" height="60" fill="#4b5563"/>
    <text x="150" y="480" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#60a5fa">TERMINAL</text>
  </g>
  
  <!-- Professional chauffeur -->
  <g transform="translate(280,280)">
    <ellipse cx="0" cy="0" rx="18" ry="25" fill="#1e293b"/>
    <rect x="-15" y="25" width="30" height="50" rx="5" fill="#334155"/>
    <rect x="-18" y="75" width="36" height="30" rx="3" fill="#1e293b"/>
  </g>
  
  <!-- Flight information display -->
  <g transform="translate(800,200)">
    <rect x="0" y="0" width="300" height="150" rx="15" fill="#1f2937" stroke="#3b82f6" stroke-width="3"/>
    <rect x="20" y="20" width="260" height="40" rx="8" fill="#0f172a" stroke="#2563eb" stroke-width="2"/>
    <text x="150" y="45" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#60a5fa">UÇUŞ BİLGİLERİ</text>
    <text x="30" y="80" font-family="Arial, sans-serif" font-size="12" fill="#93c5fd">Kalkış: 14:30</text>
    <text x="30" y="100" font-family="Arial, sans-serif" font-size="12" fill="#93c5fd">Varış: 16:45</text>
    <text x="30" y="120" font-family="Arial, sans-serif" font-size="12" fill="#93c5fd">Kapı: A12</text>
  </g>
  
  <!-- Service lighting effects -->
  <g opacity="0.4">
    <circle cx="600" cy="350" r="80" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.3">
      <animate attributeName="r" values="80;110;80" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>