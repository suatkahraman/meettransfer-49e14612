<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Black Mercedes Maybach Exterior Side View">
  <defs>
    <linearGradient id="maybachBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#020617;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chromeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#cbd5e1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#94a3b8;stop-opacity:1" />
    </linearGradient>
    <filter id="luxuryGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <rect width="800" height="600" fill="#f8fafc"/>
  
  <!-- Maybach Long Body -->
  <path d="M50,350 L120,260 L300,240 L600,240 L700,260 L750,350 L750,440 L50,440 Z" fill="url(#maybachBody)"/>
  
  <!-- Two-tone Paint Divider (Subtle) -->
  <path d="M50,320 Q400,310 750,320" stroke="#334155" stroke-width="1" fill="none" opacity="0.5"/>
  
  <!-- Chrome Window Trim -->
  <path d="M140,260 L280,250 L600,250 L680,270 L680,330 L140,330 Z" stroke="url(#chromeGradient)" stroke-width="3" fill="#1e293b"/>
  
  <!-- B-Pillar Chrome -->
  <rect x="350" y="250" width="20" height="80" fill="url(#chromeGradient)"/>
  
  <!-- Maybach Logo on C-Pillar -->
  <circle cx="640" cy="290" r="10" fill="url(#chromeGradient)"/>
  <path d="M636,294 L640,284 L644,294 M636,286 L644,286" stroke="#000" stroke-width="1"/>
  
  <!-- Wheels (Multi-spoke) -->
  <circle cx="180" cy="440" r="50" fill="#111" stroke="url(#chromeGradient)" stroke-width="2"/>
  <circle cx="620" cy="440" r="50" fill="#111" stroke="url(#chromeGradient)" stroke-width="2"/>
  <circle cx="180" cy="440" r="40" fill="none" stroke="url(#chromeGradient)" stroke-width="1" stroke-dasharray="2,4"/>
  <circle cx="620" cy="440" r="40" fill="none" stroke="url(#chromeGradient)" stroke-width="1" stroke-dasharray="2,4"/>
  
  <!-- Side Chrome Skirt -->
  <rect x="230" y="430" width="340" height="10" fill="url(#chromeGradient)"/>
  
  <!-- Headlights & Taillights -->
  <path d="M720,360 L750,360 L745,390 L720,390 Z" fill="#e2e8f0" filter="url(#luxuryGlow)"/>
  <path d="M50,360 L80,360 L85,390 L55,390 Z" fill="#ef4444" opacity="0.9"/>
</svg>