<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Black Mercedes Sprinter Exterior Side View">
  <defs>
    <linearGradient id="sprinterBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2c2c2c;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sprinterGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a202c;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#2d3748;stop-opacity:0.9" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="600" fill="#f8fafc"/>
  
  <!-- Sprinter Long Body -->
  <path d="M50,400 L50,150 L200,150 L250,220 L700,220 L750,400 L750,480 L50,480 Z" fill="url(#sprinterBody)"/>
  
  <!-- Windows (Privacy Glass) -->
  <path d="M260,230 L400,230 L400,320 L260,320 Z" fill="url(#sprinterGlass)"/>
  <path d="M420,230 L560,230 L560,320 L420,320 Z" fill="url(#sprinterGlass)"/>
  <path d="M580,230 L700,230 L710,320 L580,320 Z" fill="url(#sprinterGlass)"/>
  <path d="M100,160 L200,160 L200,320 L100,320 Z" fill="url(#sprinterGlass)"/> <!-- Front Side Window -->
  
  <!-- Wheels -->
  <circle cx="150" cy="480" r="50" fill="#222" stroke="#000" stroke-width="5"/>
  <circle cx="650" cy="480" r="50" fill="#222" stroke="#000" stroke-width="5"/>
  <circle cx="150" cy="480" r="30" fill="#666"/>
  <circle cx="650" cy="480" r="30" fill="#666"/>
  
  <!-- Side Trim -->
  <rect x="50" y="420" width="700" height="15" fill="#111"/>
  
  <!-- Headlights -->
  <path d="M50,380 L80,380 L85,410 L55,410 Z" fill="#e2e8f0"/>
  <path d="M720,380 L750,380 L745,410 L720,410 Z" fill="#ef4444"/>
</svg>