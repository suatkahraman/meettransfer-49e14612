<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Mercedes Sprinter Night City Tour with Panoramic Windows">
  <title>Mercedes Sprinter Night City Tour</title>
  <desc>Luxury Mercedes Sprinter minibus for night city tours with panoramic windows, ambient lighting, and sightseeing configuration</desc>
  
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="sprinterNight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e1e3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a2a4a;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="sprinterPanoramic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#334155;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#475569;stop-opacity:0.7" />
    </linearGradient>
    
    <linearGradient id="cityGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:0.4" />
    </linearGradient>
    
    <radialGradient id="sprinterNeon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#60a5fa;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#93c5fd;stop-opacity:0.3" />
    </radialGradient>
    
    <filter id="sprinterNeonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="#0f0f23"/>
  
  <!-- Night city skyline -->
  <g transform="translate(0,200)" opacity="0.6">
    <rect x="50" y="400" width="40" height="200" fill="#1f2937"/>
    <rect x="120" y="350" width="50" height="250" fill="#374151"/>
    <rect x="200" y="300" width="35" height="300" fill="#4b5563"/>
    <rect x="270" y="320" width="45" height="280" fill="#334155"/>
    <rect x="350" y="280" width="40" height="320" fill="#475569"/>
    <rect x="420" y="340" width="35" height="260" fill="#374151"/>
    <rect x="490" y="290" width="50" height="310" fill="#4b5563"/>
    <rect x="570" y="310" width="40" height="290" fill="#334155"/>
    <rect x="640" y="270" width="45" height="330" fill="#475569"/>
    <rect x="720" y="330" width="35" height="270" fill="#374151"/>
    <rect x="790" y="290" width="40" height="310" fill="#4b5563"/>
    <rect x="860" y="320" width="50" height="280" fill="#334155"/>
    <rect x="940" y="280" width="40" height="320" fill="#475569"/>
    <rect x="1010" y="340" width="35" height="260" fill="#374151"/>
    <rect x="1080" y="300" width="40" height="300" fill="#4b5563"/>
  </g>
  
  <!-- City lights -->
  <g opacity="0.8">
    <circle cx="100" cy="300" r="3" fill="url(#cityGlow)"/>
    <circle cx="150" cy="250" r="2" fill="url(#cityGlow)"/>
    <circle cx="220" cy="280" r="3" fill="url(#cityGlow)"/>
    <circle cx="280" cy="320" r="2" fill="url(#cityGlow)"/>
    <circle cx="350" cy="240" r="3" fill="url(#cityGlow)"/>
    <circle cx="400" cy="290" r="2" fill="url(#cityGlow)"/>
    <circle cx="480" cy="310" r="3" fill="url(#cityGlow)"/>
    <circle cx="520" cy="270" r="2" fill="url(#cityGlow)"/>
    <circle cx="600" cy="290" r="3" fill="url(#cityGlow)"/>
    <circle cx="650" cy="330" r="2" fill="url(#cityGlow)"/>
    <circle cx="720" cy="250" r="3" fill="url(#cityGlow)"/>
    <circle cx="780" cy="300" r="2" fill="url(#cityGlow)"/>
    <circle cx="850" cy="280" r="3" fill="url(#cityGlow)"/>
    <circle cx="900" cy="320" r="2" fill="url(#cityGlow)"/>
    <circle cx="980" cy="260" r="3" fill="url(#cityGlow)"/>
    <circle cx="1020" cy="300" r="2" fill="url(#cityGlow)"/>
    <circle cx="1100" cy="290" r="3" fill="url(#cityGlow)"/>
  </g>
  
  <!-- Mercedes Sprinter Night Tour -->
  <g transform="translate(250,350)">
    <!-- Main vehicle -->
    <rect x="0" y="0" width="650" height="180" rx="20" fill="url(#sprinterNight)" stroke="#3b82f6" stroke-width="3"/>
    <rect x="0" y="-5" width="150" height="190" rx="25" fill="url(#sprinterNight)" stroke="#3b82f6" stroke-width="3"/>
    
    <!-- Extended tour section -->
    <rect x="450" y="8" width="200" height="164" rx="15" fill="url(#sprinterNight)" stroke="#3b82f6" stroke-width="2"/>
    
    <!-- Panoramic windows -->
    <polygon points="20,25 130,25 140,85 10,85" fill="url(#sprinterPanoramic)" stroke="#60a5fa" stroke-width="2"/>
    <rect x="170" y="35" width="80" height="70" fill="url(#sprinterPanoramic)" stroke="#60a5fa" stroke-width="2"/>
    <rect x="270" y="35" width="80" height="70" fill="url(#sprinterPanoramic)" stroke="#60a5fa" stroke-width="2"/>
    <rect x="370" y="35" width="80" height="70" fill="url(#sprinterPanoramic)" stroke="#60a5fa" stroke-width="2"/>
    <rect x="470" y="35" width="80" height="70" fill="url(#sprinterPanoramic)" stroke="#60a5fa" stroke-width="2"/>
    <rect x="570" y="35" width="80" height="70" fill="url(#sprinterPanoramic)" stroke="#60a5fa" stroke-width="2"/>
    
    <!-- LED neon headlights -->
    <circle cx="45" cy="65" r="20" fill="url(#sprinterNeon)" filter="url(#sprinterNeonGlow)"/>
    <circle cx="110" cy="65" r="20" fill="url(#sprinterNeon)" filter="url(#sprinterNeonGlow)"/>
    
    <!-- Neon underglow -->
    <rect x="20" y="150" width="610" height="8" fill="#3b82f6" filter="url(#sprinterNeonGlow)" opacity="0.8"/>
    <rect x="20" y="165" width="610" height="4" fill="#60a5fa" opacity="0.6"/>
    
    <!-- Luxury seating -->
    <g transform="translate(80,100)">
      <rect x="0" y="0" width="60" height="70" rx="8" fill="#1f2937" stroke="#4b5563" stroke-width="2"/>
      <rect x="80" y="0" width="60" height="70" rx="8" fill="#1f2937" stroke="#4b5563" stroke-width="2"/>
      <rect x="160" y="0" width="60" height="70" rx="8" fill="#1f2937" stroke="#4b5563" stroke-width="2"/>
      <rect x="240" y="0" width="60" height="70" rx="8" fill="#1f2937" stroke="#4b5563" stroke-width="2"/>
      <rect x="320" y="0" width="60" height="70" rx="8" fill="#1f2937" stroke="#4b5563" stroke-width="2"/>
      <rect x="400" y="0" width="60" height="70" rx="8" fill="#1f2937" stroke="#4b5563" stroke-width="2"/>
      <rect x="480" y="0" width="60" height="70" rx="8" fill="#1f2937" stroke="#4b5563" stroke-width="2"/>
    </g>
    
    <!-- Chrome wheels -->
    <circle cx="130" cy="160" r="35" fill="#374151" stroke="#6b7280" stroke-width="3"/>
    <circle cx="320" cy="160" r="35" fill="#374151" stroke="#6b7280" stroke-width="3"/>
    <circle cx="510" cy="160" r="35" fill="#374151" stroke="#6b7280" stroke-width="3"/>
    
    <!-- Mercedes night emblem -->
    <circle cx="75" cy="45" r="12" fill="#e5e7eb"/>
    <path d="M75,33 L75,57 M63,45 L87,45" stroke="#1f2937" stroke-width="2"/>
    
    <!-- Tour branding -->
    <rect x="200" y="10" width="250" height="25" rx="12" fill="#1e40af" stroke="#60a5fa" stroke-width="2"/>
    <text x="325" y="27" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">GECE TURU</text>
  </g>
  
  <!-- City tour amenities -->
  <g transform="translate(900,400)">
    <!-- Tour guide display -->
    <rect x="0" y="0" width="150" height="100" rx="15" fill="#1f2937" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="75" cy="30" r="15" fill="#60a5fa"/>
    <text x="75" y="60" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#60a5fa">TUR REHBERİ</text>
    <text x="75" y="80" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#93c5fd">Multilingual</text>
  </g>
  
  <!-- Capacity indicator -->
  <g transform="translate(500,600)">
    <rect x="0" y="0" width="200" height="40" rx="20" fill="#1e40af" stroke="#60a5fa" stroke-width="2"/>
    <text x="100" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">20 Kişi Panoramik</text>
  </g>
  
  <!-- Night lighting effects -->
  <g opacity="0.6">
    <circle cx="600" cy="400" r="120" fill="none" stroke="#3b82f6" stroke-width="3" opacity="0.2">
      <animate attributeName="r" values="120;150;120" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.05;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>