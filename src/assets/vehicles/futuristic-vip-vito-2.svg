<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Black VIP Mercedes Vito Ultra Luxury Interior">
  <defs>
    <linearGradient id="luxuryLeather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#333;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="ambientLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#000;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="#cbd5e1"/>
  
  <!-- Interior Cabin -->
  <rect x="50" y="50" width="700" height="500" rx="20" fill="#0f172a"/>
  
  <!-- Ambient Lighting (Ceiling & Floor) -->
  <rect x="50" y="50" width="700" height="20" fill="#4f46e5" opacity="0.3"/>
  <rect x="50" y="530" width="700" height="20" fill="#4f46e5" opacity="0.3"/>
  
  <!-- Reclining VIP Seats -->
  <path d="M150,200 L300,200 L320,500 L130,500 Z" fill="url(#luxuryLeather)"/>
  <path d="M500,200 L650,200 L670,500 L480,500 Z" fill="url(#luxuryLeather)"/>
  
  <!-- Headrests with Monitors -->
  <rect x="170" y="140" width="110" height="60" rx="10" fill="#111" stroke="#333"/>
  <rect x="520" y="140" width="110" height="60" rx="10" fill="#111" stroke="#333"/>
  
  <!-- Center Console / Table -->
  <rect x="350" y="300" width="100" height="150" rx="10" fill="#222" stroke="#444"/>
  <circle cx="400" cy="330" r="10" fill="#4f46e5" opacity="0.8"/> <!-- Champagne Holder -->
  <circle cx="400" cy="360" r="10" fill="#4f46e5" opacity="0.8"/>
  
  <!-- Floor Carpet -->
  <rect x="100" y="500" width="600" height="50" fill="#333" opacity="0.8"/>
  
  <!-- Starlight Ceiling -->
  <circle cx="200" cy="100" r="1" fill="#fff"/>
  <circle cx="300" cy="80" r="1.5" fill="#fff"/>
  <circle cx="400" cy="110" r="1" fill="#fff"/>
  <circle cx="500" cy="90" r="1.5" fill="#fff"/>
  <circle cx="600" cy="100" r="1" fill="#fff"/>
</svg>