<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Black VIP Mercedes Vito Front View">
  <defs>
    <linearGradient id="vipFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#111;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000;stop-opacity:1" />
    </linearGradient>
    <filter id="grilleShine" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="#f1f5f9"/>
  
  <!-- Vito Front Body -->
  <path d="M150,200 L650,200 L700,500 L100,500 Z" fill="url(#vipFront)"/>
  
  <!-- Windshield -->
  <path d="M200,220 L600,220 L630,350 L170,350 Z" fill="#000" opacity="0.9"/>
  
  <!-- Premium Grille (Chrome) -->
  <rect x="250" y="380" width="300" height="80" rx="10" fill="#222" stroke="#ccc" stroke-width="2"/>
  <path d="M250,390 L550,390 M250,405 L550,405 M250,420 L550,420 M250,435 L550,435" stroke="#ccc" stroke-width="1.5" filter="url(#grilleShine)"/>
  
  <!-- Large Mercedes Logo -->
  <circle cx="400" cy="410" r="30" fill="none" stroke="#ccc" stroke-width="4"/>
  <path d="M400,380 L400,440 M375,400 L425,425 M425,400 L375,425" stroke="#ccc" stroke-width="3"/>
  
  <!-- LED Headlights -->
  <path d="M120,370 L220,370 L220,410 L130,400 Z" fill="#e2e8f0" stroke="#fff" stroke-width="1"/>
  <path d="M580,370 L680,370 L670,400 L580,410 Z" fill="#e2e8f0" stroke="#fff" stroke-width="1"/>
  <circle cx="150" cy="390" r="10" fill="#3b82f6" opacity="0.8"/> <!-- Blue Tint LED -->
  <circle cx="650" cy="390" r="10" fill="#3b82f6" opacity="0.8"/>
  
  <!-- Lower Intake -->
  <rect x="150" y="460" width="500" height="30" fill="#111" stroke="#333"/>
  <path d="M150,475 L650,475" stroke="#333" stroke-width="1"/>
</svg>