<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Black Standard Sedan Rear Interior">
  <defs>
    <linearGradient id="seatGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#333;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="#e2e8f0"/>
  
  <!-- Car Frame -->
  <path d="M50,100 L750,100 L750,550 L50,550 Z" fill="#cbd5e1"/>
  
  <!-- Rear Seats -->
  <path d="M100,250 L700,250 L700,550 L100,550 Z" fill="url(#seatGradient)"/>
  
  <!-- Seat Details -->
  <path d="M200,250 L200,550 M400,250 L400,550 M600,250 L600,550" stroke="#000" stroke-width="2" opacity="0.3"/>
  
  <!-- Headrests -->
  <rect x="150" y="200" width="100" height="60" rx="10" fill="#222"/>
  <rect x="350" y="200" width="100" height="60" rx="10" fill="#222"/>
  <rect x="550" y="200" width="100" height="60" rx="10" fill="#222"/>
  
  <!-- Window View -->
  <rect x="100" y="120" width="600" height="100" fill="#94a3b8"/>
</svg>