<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Black Mercedes Sprinter Ultra Luxury Interior">
  <defs>
    <linearGradient id="luxuryFabric" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#333;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="woodFloor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5d4037;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3e2723;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="#e2e8f0"/>
  
  <!-- Cabin Interior -->
  <rect x="50" y="50" width="700" height="500" rx="5" fill="#1f2937"/>
  
  <!-- Wood Flooring (Aisle) -->
  <rect x="350" y="50" width="100" height="500" fill="url(#woodFloor)"/>
  
  <!-- Left Row Seats (Single) -->
  <g transform="translate(100, 100)">
    <rect width="80" height="60" rx="10" fill="url(#luxuryFabric)" stroke="#444"/>
    <rect y="100" width="80" height="60" rx="10" fill="url(#luxuryFabric)" stroke="#444"/>
    <rect y="200" width="80" height="60" rx="10" fill="url(#luxuryFabric)" stroke="#444"/>
    <rect y="300" width="80" height="60" rx="10" fill="url(#luxuryFabric)" stroke="#444"/>
  </g>
  
  <!-- Right Row Seats (Double) -->
  <g transform="translate(500, 100)">
    <rect width="140" height="60" rx="10" fill="url(#luxuryFabric)" stroke="#444"/>
    <rect y="100" width="140" height="60" rx="10" fill="url(#luxuryFabric)" stroke="#444"/>
    <rect y="200" width="140" height="60" rx="10" fill="url(#luxuryFabric)" stroke="#444"/>
    <rect y="300" width="140" height="60" rx="10" fill="url(#luxuryFabric)" stroke="#444"/>
  </g>
  
  <!-- Overhead Luggage Racks -->
  <rect x="50" y="50" width="200" height="500" fill="#111" opacity="0.2"/>
  <rect x="550" y="50" width="200" height="500" fill="#111" opacity="0.2"/>
  
  <!-- LED Aisle Lighting -->
  <rect x="350" y="50" width="5" height="500" fill="#3b82f6" opacity="0.5"/>
  <rect x="445" y="50" width="5" height="500" fill="#3b82f6" opacity="0.5"/>
  
  <!-- TV Monitor at Front -->
  <rect x="300" y="50" width="200" height="10" fill="#000"/>
</svg>