<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Mercedes Sprinter 22-Passenger Luxury Minibus with TV Entertainment">
  <title>Mercedes Sprinter 22-Passenger Luxury Minibus</title>
  <desc>Premium 22-passenger Mercedes Sprinter with TV entertainment system, black leather seats, and luxury amenities</desc>
  
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="sprinterLuxury" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111827;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1f2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="sprinterLeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="sprinterScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="sprinterStar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#60a5fa;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.3" />
    </radialGradient>
    
    <filter id="sprinterLuxuryGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="#0f0f23"/>
  
  <!-- Luxury interior perspective -->
  <g transform="translate(50,50)">
    <!-- Cabin structure -->
    <polygon points="0,0 1100,0 1000,700 100,700" fill="url(#sprinterLuxury)" stroke="#374151" stroke-width="3"/>
    
    <!-- Starlight ceiling -->
    <g opacity="0.8">
      <circle cx="200" cy="80" r="2" fill="url(#sprinterStar)"/>
      <circle cx="350" cy="60" r="2" fill="url(#sprinterStar)"/>
      <circle cx="500" cy="90" r="2" fill="url(#sprinterStar)"/>
      <circle cx="650" cy="70" r="2" fill="url(#sprinterStar)"/>
      <circle cx="800" cy="85" r="2" fill="url(#sprinterStar)"/>
      <circle cx="950" cy="65" r="2" fill="url(#sprinterStar)"/>
      <circle cx="150" cy="120" r="2" fill="url(#sprinterStar)"/>
      <circle cx="300" cy="110" r="2" fill="url(#sprinterStar)"/>
      <circle cx="450" cy="130" r="2" fill="url(#sprinterStar)"/>
      <circle cx="600" cy="100" r="2" fill="url(#sprinterStar)"/>
      <circle cx="750" cy="125" r="2" fill="url(#sprinterStar)"/>
      <circle cx="900" cy="115" r="2" fill="url(#sprinterStar)"/>
    </g>
    
    <!-- Large TV screen -->
    <rect x="400" y="150" width="400" height="250" rx="15" fill="url(#sprinterScreen)" stroke="#60a5fa" stroke-width="3"/>
    <rect x="420" y="170" width="360" height="210" rx="10" fill="#000000" stroke="#3b82f6" stroke-width="2"/>
    <text x="600" y="275" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#60a5fa">TV ENTERTAINMENT</text>
    <text x="600" y="305" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#93c5fd">Premium Entertainment System</text>
    
    <!-- Left side seats (11 seats) -->
    <g transform="translate(80,200)">
      <rect x="0" y="0" width="70" height="90" rx="10" fill="url(#sprinterLeather)" stroke="#4b5563" stroke-width="2"/>
      <rect x="0" y="110" width="70" height="90" rx="10" fill="url(#sprinterLeather)" stroke="#4b5563" stroke-width="2"/>
      <rect x="0" y="220" width="70" height="90" rx="10" fill="url(#sprinterLeather)" stroke="#4b5563" stroke-width="2"/>
      <rect x="0" y="330" width="70" height="90" rx="10" fill="url(#sprinterLeather)" stroke="#4b5563" stroke-width="2"/>
      <rect x="0" y="440" width="70" height="90" rx="10" fill="url(#sprinterLeather)" stroke="#4b5563" stroke-width="2"/>
      <rect x="0" y="550" width="70" height="90" rx="10" fill="url(#sprinterLeather)" stroke="#4b5563" stroke-width="2"/>
    </g>
    
    <!-- Right side seats (11 seats) -->
    <g transform="translate(950,200)">
      <rect x="0" y="0" width="70" height="90" rx="10" fill="url(#sprinterLeather)" stroke="#4b5563" stroke-width="2"/>
      <rect x="0" y="110" width="70" height="90" rx="10" fill="url(#sprinterLeather)" stroke="#4b5563" stroke-width="2"/>
      <rect x="0" y="220" width="70" height="90" rx="10" fill="url(#sprinterLeather)" stroke="#4b5563" stroke-width="2"/>
      <rect x="0" y="330" width="70" height="90" rx="10" fill="url(#sprinterLeather)" stroke="#4b5563" stroke-width="2"/>
      <rect x="0" y="440" width="70" height="90" rx="10" fill="url(#sprinterLeather)" stroke="#4b5563" stroke-width="2"/>
      <rect x="0" y="550" width="70" height="90" rx="10" fill="url(#sprinterLeather)" stroke="#4b5563" stroke-width="2"/>
    </g>
    
    <!-- Luxury carpet -->
    <rect x="180" y="250" width="740" height="480" fill="#1f2937" stroke="#374151" stroke-width="3"/>
    
    <!-- LED ambient lighting strips -->
    <rect x="190" y="260" width="720" height="4" fill="#3b82f6" filter="url(#sprinterLuxuryGlow)"/>
    <rect x="190" y="360" width="720" height="4" fill="#3b82f6" filter="url(#sprinterLuxuryGlow)"/>
    <rect x="190" y="460" width="720" height="4" fill="#3b82f6" filter="url(#sprinterLuxuryGlow)"/>
    <rect x="190" y="560" width="720" height="4" fill="#3b82f6" filter="url(#sprinterLuxuryGlow)"/>
    <rect x="190" y="660" width="720" height="4" fill="#3b82f6" filter="url(#sprinterLuxuryGlow)"/>
    
    <!-- Minibar area -->
    <rect x="850" y="420" width="120" height="200" rx="15" fill="#1f2937" stroke="#60a5fa" stroke-width="2"/>
    <rect x="870" y="440" width="80" height="60" rx="8" fill="#3b82f6" opacity="0.8"/>
    <rect x="870" y="520" width="80" height="60" rx="8" fill="#3b82f6" opacity="0.8"/>
    <text x="910" y="475" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#ffffff">SU</text>
    <text x="910" y="555" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#ffffff">İÇECEK</text>
    
    <!-- WiFi indicator -->
    <circle cx="300" cy="450" r="20" fill="#1e40af" stroke="#60a5fa" stroke-width="2"/>
    <path d="M280,450 Q300,430 320,450" stroke="#60a5fa" stroke-width="3" fill="none"/>
    <path d="M285,450 Q300,435 315,450" stroke="#60a5fa" stroke-width="2" fill="none"/>
    <path d="M290,450 Q300,440 310,450" stroke="#60a5fa" stroke-width="1" fill="none"/>
    <text x="300" y="485" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#60a5fa">WiFi</text>
    
    <!-- Capacity display -->
    <rect x="500" y="500" width="200" height="50" rx="25" fill="#1e40af" stroke="#60a5fa" stroke-width="3"/>
    <text x="600" y="530" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">22 Kişi Lüks</text>
  </g>
  
  <!-- Premium lighting effects -->
  <g opacity="0.5">
    <circle cx="600" cy="400" r="100" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.2">
      <animate attributeName="r" values="100;130;100" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.05;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>