<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Black Mercedes Sprinter Front View">
  <defs>
    <linearGradient id="sprinterFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2c2c2c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="#f1f5f9"/>
  
  <!-- Sprinter Tall Body -->
  <path d="M150,150 L650,150 L700,500 L100,500 Z" fill="url(#sprinterFront)"/>
  
  <!-- Large Windshield -->
  <path d="M180,180 L620,180 L650,320 L150,320 Z" fill="#000" opacity="0.9"/>
  
  <!-- Massive Grille -->
  <rect x="250" y="350" width="300" height="100" rx="10" fill="#111" stroke="#333"/>
  <path d="M250,370 L550,370 M250,390 L550,390 M250,410 L550,410 M250,430 L550,430" stroke="#333" stroke-width="2"/>
  
  <!-- Large Mercedes Logo -->
  <circle cx="400" cy="400" r="35" fill="none" stroke="#ccc" stroke-width="4"/>
  <path d="M400,365 L400,435 M370,390 L430,420 M430,390 L370,420" stroke="#ccc" stroke-width="3"/>
  
  <!-- Headlights -->
  <path d="M100,350 L220,350 L220,400 L110,390 Z" fill="#e2e8f0"/>
  <path d="M580,350 L700,350 L690,390 L580,400 Z" fill="#e2e8f0"/>
  
  <!-- Bumper -->
  <rect x="100" y="460" width="600" height="40" fill="#222"/>
  
  <!-- Mirrors (Large) -->
  <path d="M120,250 L80,250 L80,180 Z" fill="#111"/>
  <path d="M680,250 L720,250 L720,180 Z" fill="#111"/>
  
  <!-- Roof Marker Lights -->
  <circle cx="200" cy="160" r="3" fill="#fbbf24"/>
  <circle cx="400" cy="160" r="3" fill="#fbbf24"/>
  <circle cx="600" cy="160" r="3" fill="#fbbf24"/>
</svg>