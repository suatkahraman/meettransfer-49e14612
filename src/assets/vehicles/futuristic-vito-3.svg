<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Black Mercedes Vito Front View">
  <defs>
    <linearGradient id="vitoFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2c2c2c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="#f1f5f9"/>
  
  <!-- Vito Front Body -->
  <path d="M150,200 L650,200 L700,500 L100,500 Z" fill="url(#vitoFront)"/>
  
  <!-- Windshield -->
  <path d="M200,220 L600,220 L630,350 L170,350 Z" fill="#1e293b"/>
  
  <!-- Grille -->
  <rect x="250" y="380" width="300" height="80" rx="10" fill="#111" stroke="#444"/>
  <path d="M280,380 L280,460 M340,380 L340,460 M400,380 L400,460 M460,380 L460,460 M520,380 L520,460" stroke="#444" stroke-width="2"/>
  
  <!-- Mercedes Logo -->
  <circle cx="400" cy="420" r="25" fill="none" stroke="#ccc" stroke-width="3"/>
  <path d="M400,395 L400,445 M380,410 L420,430 M420,410 L380,430" stroke="#ccc" stroke-width="2"/>
  
  <!-- Headlights -->
  <path d="M120,370 L220,370 L220,420 L130,410 Z" fill="#e2e8f0"/>
  <path d="M580,370 L680,370 L670,410 L580,420 Z" fill="#e2e8f0"/>
  
  <!-- Bumper -->
  <rect x="100" y="460" width="600" height="40" fill="#222"/>
  
  <!-- Mirrors -->
  <path d="M120,280 L80,280 L80,240 Z" fill="#111"/>
  <path d="M680,280 L720,280 L720,240 Z" fill="#111"/>
</svg>