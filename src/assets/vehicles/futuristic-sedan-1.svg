<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Black Standard Sedan Exterior Side View">
  <defs>
    <linearGradient id="blackBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2c2c2c;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a202c;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#2d3748;stop-opacity:0.7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <rect width="800" height="600" fill="#f8fafc"/>
  
  <!-- Car Body -->
  <path d="M100,350 L150,280 L280,240 L520,240 L650,280 L700,350 L700,420 L100,420 Z" fill="url(#blackBody)"/>
  
  <!-- Windows -->
  <path d="M290,250 L510,250 L630,290 L170,290 Z" fill="url(#glass)"/>
  
  <!-- Wheels -->
  <circle cx="200" cy="420" r="45" fill="#333" stroke="#000" stroke-width="5"/>
  <circle cx="600" cy="420" r="45" fill="#333" stroke="#000" stroke-width="5"/>
  <circle cx="200" cy="420" r="25" fill="#666"/>
  <circle cx="600" cy="420" r="25" fill="#666"/>
  
  <!-- Headlights -->
  <path d="M680,360 L700,360 L695,380 L680,380 Z" fill="#e2e8f0" filter="url(#glow)"/>
  <path d="M100,360 L120,360 L125,380 L105,380 Z" fill="#ef4444" opacity="0.8"/>

  <!-- Reflection -->
  <path d="M150,320 Q400,340 650,320" stroke="#444" stroke-width="2" fill="none" opacity="0.5"/>
</svg>