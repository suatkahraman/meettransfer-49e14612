<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Black Standard Sedan Interior">
  <defs>
    <linearGradient id="interiorBlack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#333;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="#cbd5e1"/>
  
  <!-- Dashboard -->
  <path d="M0,400 L800,400 L800,600 L0,600 Z" fill="#222"/>
  
  <!-- Steering Wheel -->
  <circle cx="200" cy="450" r="60" fill="none" stroke="#111" stroke-width="15"/>
  <rect x="140" y="440" width="120" height="20" fill="#111"/>
  
  <!-- Seats -->
  <path d="M450,250 L650,250 L700,600 L400,600 Z" fill="url(#interiorBlack)"/>
  <path d="M100,250 L300,250 L350,600 L50,600 Z" fill="url(#interiorBlack)"/>
  
  <!-- Window View -->
  <rect x="0" y="0" width="800" height="300" fill="#94a3b8"/>
</svg>