<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Mercedes Sprinter Corporate Business Transport with Meeting Setup">
  <title>Mercedes Sprinter Corporate Business Transport</title>
  <desc>Executive Mercedes Sprinter minibus with business meeting configuration, conference seating, and professional amenities</desc>
  
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="sprinterCorporate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2937;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#374151;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="sprinterConference" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="sprinterTable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#374151;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4b5563;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6b7280;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="sprinterBusinessLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#3b82f6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:0.3" />
    </radialGradient>
    
    <filter id="sprinterBusinessGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="#0f172a"/>
  
  <!-- Corporate building background -->
  <g transform="translate(50,50)" opacity="0.4">
    <rect x="0" y="300" width="200" height="450" fill="#1f2937" stroke="#374151" stroke-width="2"/>
    <rect x="50" y="250" width="30" height="50" fill="#4b5563"/>
    <rect x="120" y="200" width="30" height="100" fill="#4b5563"/>
    <rect x="0" y="100" width="200" height="30" fill="#374151"/>
    <text x="100" y="500" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#60a5fa">OFİS BİNASI</text>
  </g>
  
  <!-- Executive Mercedes Sprinter -->
  <g transform="translate(300,250)">
    <!-- Main vehicle -->
    <rect x="0" y="0" width="600" height="200" rx="20" fill="url(#sprinterCorporate)" stroke="#4b5563" stroke-width="3"/>
    <rect x="0" y="-10" width="140" height="220" rx="25" fill="url(#sprinterCorporate)" stroke="#4b5563" stroke-width="3"/>
    
    <!-- Extended passenger section -->
    <rect x="420" y="10" width="180" height="180" rx="15" fill="url(#sprinterCorporate)" stroke="#4b5563" stroke-width="2"/>
    
    <!-- Corporate branding -->
    <rect x="120" y="30" width="360" height="30" rx="8" fill="url(#sprinterTable)" stroke="#60a5fa" stroke-width="2"/>
    <text x="300" y="50" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">KURUMSAL TAŞIMA</text>
    
    <!-- Conference table setup -->
    <rect x="150" y="80" width="300" height="60" rx="10" fill="url(#sprinterTable)" stroke="#6b7280" stroke-width="2"/>
    <rect x="160" y="90" width="280" height="40" rx="5" fill="#374151" stroke="#4b5563" stroke-width="1"/>
    <text x="300" y="115" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#60a5fa">TOPLANTI MASASI</text>
    
    <!-- Executive seating -->
    <g transform="translate(80,150)">
      <rect x="0" y="0" width="60" height="80" rx="8" fill="url(#sprinterConference)" stroke="#4b5563" stroke-width="2"/>
      <rect x="80" y="0" width="60" height="80" rx="8" fill="url(#sprinterConference)" stroke="#4b5563" stroke-width="2"/>
      <rect x="160" y="0" width="60" height="80" rx="8" fill="url(#sprinterConference)" stroke="#4b5563" stroke-width="2"/>
      <rect x="240" y="0" width="60" height="80" rx="8" fill="url(#sprinterConference)" stroke="#4b5563" stroke-width="2"/>
      <rect x="320" y="0" width="60" height="80" rx="8" fill="url(#sprinterConference)" stroke="#4b5563" stroke-width="2"/>
      <rect x="400" y="0" width="60" height="80" rx="8" fill="url(#sprinterConference)" stroke="#4b5563" stroke-width="2"/>
      <rect x="480" y="0" width="60" height="80" rx="8" fill="url(#sprinterConference)" stroke="#4b5563" stroke-width="2"/>
    </g>
    
    <!-- Windows with privacy tint -->
    <polygon points="15,20 125,20 135,90 5,90" fill="#1f2937" stroke="#2563eb" stroke-width="2"/>
    <rect x="160" y="40" width="70" height="80" fill="#1f2937" stroke="#2563eb" stroke-width="2"/>
    <rect x="250" y="40" width="70" height="80" fill="#1f2937" stroke="#2563eb" stroke-width="2"/>
    <rect x="340" y="40" width="70" height="80" fill="#1f2937" stroke="#2563eb" stroke-width="2"/>
    <rect x="430" y="40" width="70" height="80" fill="#1f2937" stroke="#2563eb" stroke-width="2"/>
    <rect x="520" y="40" width="70" height="80" fill="#1f2937" stroke="#2563eb" stroke-width="2"/>
    <rect x="610" y="40" width="70" height="80" fill="#1f2937" stroke="#2563eb" stroke-width="2"/>
    
    <!-- LED business lighting -->
    <circle cx="40" cy="60" r="12" fill="url(#sprinterBusinessLight)" filter="url(#sprinterBusinessGlow)"/>
    <circle cx="100" cy="60" r="12" fill="url(#sprinterBusinessLight)" filter="url(#sprinterBusinessGlow)"/>
    
    <!-- Chrome wheels -->
    <circle cx="120" cy="180" r="35" fill="#374151" stroke="#6b7280" stroke-width="3"/>
    <circle cx="300" cy="180" r="35" fill="#374151" stroke="#6b7280" stroke-width="3"/>
    <circle cx="480" cy="180" r="35" fill="#374151" stroke="#6b7280" stroke-width="3"/>
    
    <!-- Mercedes business emblem -->
    <circle cx="70" cy="40" r="12" fill="#e5e7eb"/>
    <path d="M70,28 L70,52 M58,40 L82,40" stroke="#1f2937" stroke-width="2"/>
  </g>
  
  <!-- Business amenities -->
  <g transform="translate(950,300)">
    <!-- WiFi router display -->
    <rect x="0" y="0" width="120" height="80" rx="10" fill="#1f2937" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="30" cy="25" r="8" fill="#60a5fa"/>
    <circle cx="60" cy="25" r="8" fill="#60a5fa"/>
    <circle cx="90" cy="25" r="8" fill="#60a5fa"/>
    <text x="60" y="55" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#60a5fa">WiFi</text>
    <text x="60" y="70" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#93c5fd">Premium</text>
  </g>
  
  <!-- Capacity indicator -->
  <g transform="translate(500,500)">
    <rect x="0" y="0" width="200" height="40" rx="20" fill="#1e40af" stroke="#60a5fa" stroke-width="2"/>
    <text x="100" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">Kurumsal 18 Kişi</text>
  </g>
  
  <!-- Corporate lighting effects -->
  <g opacity="0.5">
    <circle cx="600" cy="400" r="90" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.2">
      <animate attributeName="r" values="90;120;90" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.05;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>