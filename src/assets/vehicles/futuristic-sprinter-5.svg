<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Black Mercedes Sprinter Rear Exterior View">
  <defs>
    <linearGradient id="sprinterRear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2c2c2c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="#f1f5f9"/>
  
  <!-- Sprinter Tall Rear Body -->
  <path d="M150,100 L650,100 L650,500 L150,500 Z" fill="url(#sprinterRear)"/>
  
  <!-- Rear Doors -->
  <path d="M400,100 L400,500" stroke="#111" stroke-width="3"/>
  
  <!-- Rear Windows -->
  <path d="M200,150 L380,150 L380,300 L200,300 Z" fill="#000" opacity="0.95"/>
  <path d="M420,150 L600,150 L600,300 L420,300 Z" fill="#000" opacity="0.95"/>
  
  <!-- Door Handles -->
  <rect x="360" y="320" width="30" height="10" fill="#333"/>
  <rect x="410" y="320" width="30" height="10" fill="#333"/>
  
  <!-- Tall Taillights -->
  <path d="M150,250 L180,250 L180,450 L150,450 Z" fill="#ef4444"/>
  <path d="M620,250 L650,250 L650,450 L620,450 Z" fill="#ef4444"/>
  
  <!-- License Plate Area -->
  <rect x="300" y="420" width="200" height="50" rx="5" fill="#222"/>
  <rect x="310" y="430" width="180" height="30" fill="#fff"/>
  
  <!-- Mercedes Logo -->
  <circle cx="280" cy="380" r="15" fill="none" stroke="#ccc" stroke-width="2"/>
  <path d="M280,368 L280,392 M270,375 L290,385 M290,375 L270,385" stroke="#ccc" stroke-width="1.5"/>
  
  <!-- Bumper -->
  <rect x="150" y="480" width="500" height="20" fill="#111"/>
  
  <!-- High Mount Stop Light -->
  <rect x="350" y="110" width="100" height="10" fill="#ef4444"/>
</svg>