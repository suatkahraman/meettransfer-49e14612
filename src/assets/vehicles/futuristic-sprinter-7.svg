<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Mercedes Sprinter Family Travel with Entertainment System">
  <title>Mercedes Sprinter Family Travel Minibus</title>
  <desc>Family-friendly Mercedes Sprinter minibus with entertainment system, comfortable seating, and child-friendly amenities</desc>
  
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="sprinterFamily" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="sprinterComfort" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#374151;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4b5563;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6b7280;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="sprinterEntertainment" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="sprinterFamilyLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#f59e0b;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:0.3" />
    </radialGradient>
    
    <filter id="sprinterFamilyGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="#0f172a"/>
  
  <!-- Scenic route background -->
  <g transform="translate(0,500)" opacity="0.5">
    <path d="M0,200 Q300,150 600,180 T1200,200" stroke="#374151" stroke-width="4" fill="none"/>
    <path d="M0,220 Q300,170 600,200 T1200,220" stroke="#4b5563" stroke-width="2" fill="none"/>
    <circle cx="200" cy="180" r="30" fill="#22c55e" opacity="0.6"/>
    <circle cx="400" cy="160" r="25" fill="#22c55e" opacity="0.6"/>
    <circle cx="600" cy="170" r="35" fill="#22c55e" opacity="0.6"/>
    <circle cx="800" cy="165" r="28" fill="#22c55e" opacity="0.6"/>
    <circle cx="1000" cy="175" r="32" fill="#22c55e" opacity="0.6"/>
  </g>
  
  <!-- Family Mercedes Sprinter -->
  <g transform="translate(200,300)">
    <!-- Main vehicle -->
    <rect x="0" y="0" width="700" height="200" rx="25" fill="url(#sprinterFamily)" stroke="#60a5fa" stroke-width="3"/>
    <rect x="0" y="-10" width="160" height="220" rx="30" fill="url(#sprinterFamily)" stroke="#60a5fa" stroke-width="3"/>
    
    <!-- Extended family section -->
    <rect x="480" y="15" width="220" height="170" rx="20" fill="url(#sprinterFamily)" stroke="#60a5fa" stroke-width="2"/>
    
    <!-- Family-friendly branding -->
    <rect x="150" y="30" width="400" height="35" rx="17" fill="url(#sprinterEntertainment)" stroke="#fbbf24" stroke-width="2"/>
    <text x="350" y="52" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">AİLE TAŞIMA</text>
    
    <!-- Entertainment screens -->
    <rect x="200" y="80" width="300" height="180" rx="15" fill="url(#sprinterEntertainment)" stroke="#fbbf24" stroke-width="3"/>
    <rect x="220" y="100" width="260" height="140" rx="10" fill="#000000" stroke="#f59e0b" stroke-width="2"/>
    <text x="350" y="170" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#fbbf24">TV & OYUN</text>
    <text x="350" y="200" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#f59e0b">Eğlence Sistemi</text>
    
    <!-- Comfortable seating -->
    <g transform="translate(80,120)">
      <rect x="0" y="0" width="70" height="85" rx="10" fill="url(#sprinterComfort)" stroke="#6b7280" stroke-width="2"/>
      <rect x="0" y="100" width="70" height="85" rx="10" fill="url(#sprinterComfort)" stroke="#6b7280" stroke-width="2"/>
      <rect x="0" y="200" width="70" height="85" rx="10" fill="url(#sprinterComfort)" stroke="#6b7280" stroke-width="2"/>
    </g>
    
    <!-- Right side seating -->
    <g transform="translate("translate(750,120)">
      <rect x="0" y="0" width="70" height="85" rx="10" fill="url(#sprinterComfort)" stroke="#6b7280" stroke-width="2"/>
      <rect x="0" y="100" width="70" height="85" rx="10" fill="url(#sprinterComfort)" stroke="#6b7280" stroke-width="2"/>
      <rect x="0" y="200" width="70" height="85" rx="10" fill="url(#sprinterComfort)" stroke="#6b7280" stroke-width="2"/>
    </g>
    
    <!-- Large family windows -->
    <polygon points="20,40 140,40 150,110 10,110" fill="url(#sprinterPanoramic)" stroke="#fbbf24" stroke-width="2"/>
    <rect x="180" y="40" width="80" height="90" fill="url(#sprinterPanoramic)" stroke="#fbbf24" stroke-width="2"/>
    <rect x="280" y="40" width="80" height="90" fill="url(#sprinterPanoramic)" stroke="#fbbf24" stroke-width="2"/>
    <rect x="380" y="40" width="80" height="90" fill="url(#sprinterPanoramic)" stroke="#fbbf24" stroke-width="2"/>
    <rect x="480" y="40" width="80" height="90" fill="url(#sprinterPanoramic)" stroke="#fbbf24" stroke-width="2"/>
    <rect x="580" y="40" width="80" height="90" fill="url(#sprinterPanoramic)" stroke="#fbbf24" stroke-width="2"/>
    <rect x="680" y="40" width="80" height="90" fill="url(#sprinterPanoramic)" stroke="#fbbf24" stroke-width="2"/>
    
    <!-- LED family headlights -->
    <circle cx="50" cy="80" r="20" fill="url(#sprinterFamilyLight)" filter="url(#sprinterFamilyGlow)"/>
    <circle cx="120" cy="80" r="20" fill="url(#sprinterFamilyLight)" filter="url(#sprinterFamilyGlow)"/>
    
    <!-- Child-friendly wheels -->
    <circle cx="140" cy="180" r="40" fill="#374151" stroke="#6b7280" stroke-width="4"/>
    <circle cx="350" cy="180" r="40" fill="#374151" stroke="#6b7280" stroke-width="4"/>
    <circle cx="560" cy="180" r="40" fill="#374151" stroke="#6b7280" stroke-width="4"/>
    
    <!-- Mercedes family emblem -->
    <circle cx="80" cy="60" r="15" fill="#e5e7eb"/>
    <path d="M80,45 L80,75 M65,60 L95,60" stroke="#1f2937" stroke-width="3"/>
  </g>
  
  <!-- Family amenities -->
  <g transform="translate(900,350)">
    <!-- Child seat indicator -->
    <rect x="0" y="0" width="120" height="80" rx="15" fill="#1f2937" stroke="#22c55e" stroke-width="2"/>
    <circle cx="60" cy="25" r="12" fill="#22c55e"/>
    <text x="60" y="50" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#22c55e">ÇOCUK</text>
    <text x="60" y="65" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#22c55e">Koltuğu</text>
  </g>
  
  <!-- Family capacity indicator -->
  <g transform="translate(500,550)">
    <rect x="0" y="0" width="200" height="40" rx="20" fill="#1e40af" stroke="#fbbf24" stroke-width="2"/>
    <text x="100" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">Aile 16 Kişi</text>
  </g>
  
  <!-- Family lighting effects -->
  <g opacity="0.6">
    <circle cx="600" cy="400" r="100" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.3">
      <animate attributeName="r" values="100;130;100" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>