<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Black Mercedes Vito Rear Interior">
  <defs>
    <linearGradient id="vitoRearInterior" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#333;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="#e2e8f0"/>
  
  <!-- Interior Frame -->
  <path d="M50,50 L750,50 L750,550 L50,550 Z" fill="#cbd5e1"/>
  
  <!-- Back Rows (Facing Forward) -->
  <path d="M150,250 L650,250 L650,550 L150,550 Z" fill="url(#vitoRearInterior)"/>
  
  <!-- Headrests -->
  <rect x="200" y="200" width="100" height="60" rx="10" fill="#222"/>
  <rect x="350" y="200" width="100" height="60" rx="10" fill="#222"/>
  <rect x="500" y="200" width="100" height="60" rx="10" fill="#222"/>
  
  <!-- Side Windows -->
  <rect x="50" y="100" width="80" height="300" fill="#94a3b8"/>
  <rect x="670" y="100" width="80" height="300" fill="#94a3b8"/>
  
  <!-- Rear Window View -->
  <rect x="150" y="100" width="500" height="100" fill="#94a3b8"/>
  
  <!-- Ceiling Light -->
  <rect x="350" y="60" width="100" height="20" rx="5" fill="#f1f5f9" opacity="0.8"/>
</svg>