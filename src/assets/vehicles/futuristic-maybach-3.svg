<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Black Mercedes Maybach Front View">
  <defs>
    <linearGradient id="maybachFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#020617;stop-opacity:1" />
    </linearGradient>
    <filter id="chromeShine" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="#f1f5f9"/>
  
  <!-- Maybach Body -->
  <path d="M150,250 L650,250 L700,500 L100,500 Z" fill="url(#maybachFront)"/>
  
  <!-- Windshield -->
  <path d="M200,270 L600,270 L630,350 L170,350 Z" fill="#000" opacity="0.9"/>
  
  <!-- Signature Vertical Grille -->
  <path d="M250,380 L550,380 L530,480 L270,480 Z" fill="#111" stroke="#ccc" stroke-width="3"/>
  <path d="M270,380 L270,480 M290,380 L290,480 M310,380 L310,480 M330,380 L330,480 M350,380 L350,480 M370,380 L370,480 M390,380 L390,480 M410,380 L410,480 M430,380 L430,480 M450,380 L450,480 M470,380 L470,480 M490,380 L490,480 M510,380 L510,480 M530,380 L530,480" stroke="#ccc" stroke-width="1.5" filter="url(#chromeShine)"/>
  
  <!-- Maybach Hood Ornament -->
  <circle cx="400" cy="370" r="10" fill="none" stroke="#ccc" stroke-width="2"/>
  <path d="M400,360 L400,380 M393,367 L407,373 M407,367 L393,373" stroke="#ccc" stroke-width="1.5"/>
  <path d="M400,380 L400,350" stroke="#ccc" stroke-width="2"/>
  
  <!-- Headlights (Digital Light) -->
  <path d="M120,380 L240,380 L230,410 L130,400 Z" fill="#e2e8f0" stroke="#fff" stroke-width="1"/>
  <path d="M560,380 L680,380 L670,400 L570,410 Z" fill="#e2e8f0" stroke="#fff" stroke-width="1"/>
  <circle cx="150" cy="395" r="5" fill="#3b82f6" opacity="0.8"/>
  <circle cx="170" cy="395" r="5" fill="#3b82f6" opacity="0.8"/>
  <circle cx="190" cy="395" r="5" fill="#3b82f6" opacity="0.8"/>
  <circle cx="610" cy="395" r="5" fill="#3b82f6" opacity="0.8"/>
  <circle cx="630" cy="395" r="5" fill="#3b82f6" opacity="0.8"/>
  <circle cx="650" cy="395" r="5" fill="#3b82f6" opacity="0.8"/>
  
  <!-- Chrome Lower Bumper -->
  <path d="M150,480 L650,480 L630,510 L170,510 Z" fill="#ccc" opacity="0.8" filter="url(#chromeShine)"/>
</svg>