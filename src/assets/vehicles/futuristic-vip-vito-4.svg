<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Black VIP Mercedes Vito Rear Interior with TV">
  <defs>
    <linearGradient id="tvScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111;stop-opacity:1" />
    </linearGradient>
    <filter id="screenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="#e2e8f0"/>
  
  <!-- Interior Walls -->
  <path d="M50,50 L750,50 L750,550 L50,550 Z" fill="#333"/>
  <rect x="50" y="50" width="700" height="500" fill="#1f2937"/>
  
  <!-- Large TV Screen -->
  <rect x="150" y="80" width="500" height="280" rx="10" fill="url(#tvScreen)" stroke="#222" stroke-width="5"/>
  <rect x="160" y="90" width="480" height="260" fill="#000"/>
  <text x="400" y="230" font-family="Arial" font-size="24" fill="#3b82f6" text-anchor="middle" opacity="0.8" filter="url(#screenGlow)">MEET TRANSFER</text>
  
  <!-- Sound System Speakers -->
  <circle cx="100" cy="150" r="30" fill="#111" stroke="#444" stroke-width="2"/>
  <circle cx="700" cy="150" r="30" fill="#111" stroke="#444" stroke-width="2"/>
  
  <!-- Rear Facing Seats -->
  <path d="M100,400 L300,400 L300,600 L100,600 Z" fill="#222"/>
  <path d="M500,400 L700,400 L700,600 L500,600 Z" fill="#222"/>
  
  <!-- Ambient Light Strip -->
  <rect x="50" y="380" width="700" height="5" fill="#4f46e5" opacity="0.6" filter="url(#screenGlow)"/>
  
  <!-- Foldable Table -->
  <rect x="300" y="450" width="200" height="150" fill="#111" stroke="#333"/>
  <circle cx="350" cy="500" r="15" fill="#444"/> <!-- Cup Holder -->
  <circle cx="450" cy="500" r="15" fill="#444"/>
</svg>