  <!-- Futuristic Mercedes Maybach for VIP group -->
  <path d="M100 300 Q130 200 230 200 L570 200 Q700 200 700 300 L720 380 L680 460 L120 460 L80 380 Z" fill="#000000" stroke="#9b59b6" stroke-width="8"/>
  <path d="M120 230 Q150 170 300 170 L500 170 Q700 170 700 230 L690 300 L120 300 Z" fill="url(#maybachStarlightGroup)" stroke="#8e44ad" stroke-width="6"/>
  
  <!-- VIP group silhouettes -->
