      <stop offset="20%" style="stop-color:#9b59b6;stop-opacity:0.9" />
      <stop offset="40%" style="stop-color:#8e44ad;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#4a90e2;stop-opacity:0.3" />
    </radialGradient>
  </defs>
  
  <!-- VIP group travel Maybach background -->
