<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Black Standard Sedan Rear View">
  <defs>
    <linearGradient id="blackRear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2c2c2c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="#f1f5f9"/>
  
  <!-- Car Rear Body -->
  <path d="M200,300 L600,300 L650,450 L150,450 Z" fill="url(#blackRear)"/>
  <path d="M250,200 L550,200 L600,300 L200,300 Z" fill="#1e293b"/> <!-- Rear Window -->
  
  <!-- Taillights -->
  <path d="M160,340 L240,340 L240,370 L180,370 Z" fill="#ef4444"/>
  <path d="M560,340 L640,340 L620,370 L560,370 Z" fill="#ef4444"/>
  
  <!-- License Plate -->
  <rect x="350" y="360" width="100" height="30" fill="#fff" stroke="#333"/>
  
  <!-- Exhaust -->
  <circle cx="200" cy="440" r="10" fill="#333"/>
  <circle cx="600" cy="440" r="10" fill="#333"/>
</svg>