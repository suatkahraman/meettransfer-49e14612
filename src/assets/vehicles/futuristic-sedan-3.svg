<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Black Standard Sedan Front View">
  <defs>
    <linearGradient id="blackFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2c2c2c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="#f1f5f9"/>
  
  <!-- Car Front Body -->
  <path d="M200,300 L600,300 L650,450 L150,450 Z" fill="url(#blackFront)"/>
  <path d="M250,200 L550,200 L600,300 L200,300 Z" fill="#1e293b"/> <!-- Windshield -->
  
  <!-- Grille -->
  <rect x="300" y="350" width="200" height="60" rx="5" fill="#111" stroke="#333"/>
  <path d="M320,350 L320,410 M360,350 L360,410 M400,350 L400,410 M440,350 L440,410 M480,350 L480,410" stroke="#333" stroke-width="2"/>
  
  <!-- Headlights -->
  <path d="M160,340 L240,340 L240,370 L180,370 Z" fill="#e2e8f0"/>
  <path d="M560,340 L640,340 L620,370 L560,370 Z" fill="#e2e8f0"/>
  
  <!-- Mirror -->
  <path d="M180,280 L140,280 L140,260 Z" fill="#111"/>
  <path d="M620,280 L660,280 L660,260 Z" fill="#111"/>
</svg>