<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Black VIP Mercedes Vito Rear Exterior">
  <defs>
    <linearGradient id="vipRear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#111;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="#f1f5f9"/>
  
  <!-- Vito Rear Body -->
  <path d="M150,150 L650,150 L650,500 L150,500 Z" fill="url(#vipRear)"/>
  
  <!-- Rear Privacy Window -->
  <path d="M200,180 L600,180 L600,320 L200,320 Z" fill="#000" opacity="0.95"/>
  
  <!-- Chrome Trim -->
  <path d="M150,330 L650,330" stroke="#ccc" stroke-width="2"/>
  
  <!-- Taillights (Darkened) -->
  <path d="M150,300 L180,300 L180,450 L150,450 Z" fill="#991b1b" stroke="#333"/>
  <path d="M620,300 L650,300 L650,450 L620,450 Z" fill="#991b1b" stroke="#333"/>
  
  <!-- License Plate Area -->
  <rect x="300" y="400" width="200" height="50" rx="5" fill="#111"/>
  <rect x="310" y="410" width="180" height="30" fill="#fff"/>
  <text x="350" y="430" font-family="Arial" font-size="14" fill="#000">VIP 001</text>
  
  <!-- Mercedes Logo -->
  <circle cx="400" cy="360" r="20" fill="none" stroke="#ccc" stroke-width="3"/>
  <path d="M400,340 L400,380 M385,355 L415,365 M415,355 L385,365" stroke="#ccc" stroke-width="2"/>
  
  <!-- Bumper & Exhaust -->
  <rect x="150" y="480" width="500" height="20" fill="#111"/>
  <rect x="200" y="490" width="40" height="10" rx="5" fill="#333" stroke="#ccc"/>
  <rect x="560" y="490" width="40" height="10" rx="5" fill="#333" stroke="#ccc"/>
</svg>