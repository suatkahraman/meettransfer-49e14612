<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vipVitoCoupleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e91e63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9c27b0;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="coupleVipVitoLight" cx="50%" cy="60%" r="55%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#e91e63;stop-opacity:0.3" />
    </radialGradient>
    <radialGradient id="vipStarlightCouple" cx="50%" cy="45%" r="85%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="25%" style="stop-color:#e91e63;stop-opacity:0.7" />
      <stop offset="50%" style="stop-color:#9c27b0;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#4a90e2;stop-opacity:0.2" />
    </radialGradient>
  </defs>
  
  <!-- Romantic VIP couple background -->
  <rect width="800" height="450" fill="url(#vipVitoCoupleBg)"/>
  
  <!-- Romantic atmosphere -->
  <circle cx="180" cy="150" r="60" fill="url(#coupleVipVitoLight)" opacity="0.5"/>
  <circle cx="620" cy="180" r="50" fill="url(#coupleVipVitoLight)" opacity="0.4"/>
  
  <!-- Futuristic Mercedes VIP Vito for couple -->
  <path d="M160 290 Q190 220 270 220 L530 220 Q610 220 640 290 L660 350 L620 390 L180 390 L140 350 Z" fill="#030303" stroke="#e91e63" stroke-width="4"/>
  <path d="M180 230 Q210 190 300 190 L500 190 Q610 190 640 230 L630 290 L180 290 Z" fill="url(#vipStarlightCouple)" stroke="#9c27b0" stroke-width="3"/>
  
  <!-- VIP couple silhouettes with champagne -->
  <rect x="280" y="195" width="35" height="60" fill="#2c3e50" rx="17"/>
  <rect x="325" y="200" width="30" height="55" fill="#2c3e50" rx="15"/>
  <circle cx="297" cy="185" r="15" fill="#34495e"/>
  <circle cx="340" cy="187" r="13" fill="#34495e"/>
  
  <!-- Champagne glasses -->
  <rect x="310" y="240" width="8" height="15" fill="#ffffff" opacity="0.8" rx="2"/>
  <rect x="330" y="240" width="8" height="15" fill="#ffffff" opacity="0.8" rx="2"/>
  
  <!-- VIP romantic ambient lighting -->
  <rect x="0" y="320" width="800" height="6" fill="#e91e63" opacity="0.8"/>
  <rect x="0" y="380" width="800" height="4" fill="#9c27b0" opacity="0.6"/>
  
  <!-- Large VIP Vito wheels -->
  <circle cx="250" cy="390" r="35" fill="#2c3e50" stroke="#7f8c8d" stroke-width="5"/>
  <circle cx="570" cy="390" r="35" fill="#2c3e50" stroke="#7f8c8d" stroke-width="5"/>
  <circle cx="250" cy="390" r="21" fill="#34495e"/>
  <circle cx="570" cy="390" r="21" fill="#34495e"/>
  
  <!-- VIP romantic headlights -->
  <ellipse cx="610" cy="270" rx="16" ry="8" fill="#e91e63" opacity="0.9"/>
  <ellipse cx="230" cy="270" rx="13" ry="6" fill="#ff6b35" opacity="0.8"/>
  
  <!-- VIP starlight romantic strips -->
  <rect x="590" y="260" width="35" height="4" fill="#e91e63" opacity="0.8"/>
  <rect x="210" y="260" width="28" height="4" fill="#ff6b35" opacity="0.8"/>
  
  <!-- Ground reflection -->
  <ellipse cx="400" cy="400" rx="300" ry="20" fill="#e91e63" opacity="0.15"/>
  
