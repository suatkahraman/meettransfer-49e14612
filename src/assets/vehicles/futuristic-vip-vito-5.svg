  <rect x="350" y="320" width="100" height="35" fill="#9c27b0" opacity="0.5" rx="8"/>
  <text x="400" y="345" font-family="Arial" font-size="14" fill="#ffffff" text-anchor="middle">VIP COUPLE</text>
  
  <!-- SEO Alt Text: Futuristic Mercedes VIP Vito minivan romantic couple transfer with starlight ceiling and champagne service -->
