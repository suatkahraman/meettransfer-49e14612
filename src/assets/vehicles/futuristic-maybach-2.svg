<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="maybachInterior" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="galaxyStarlight" cx="50%" cy="25%" r="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.99" />
      <stop offset="10%" style="stop-color:#f39c12;stop-opacity:0.9" />
      <stop offset="20%" style="stop-color:#9b59b6;stop-opacity:0.8" />
      <stop offset="35%" style="stop-color:#8e44ad;stop-opacity:0.7" />
      <stop offset="50%" style="stop-color:#4a90e2;stop-opacity:0.5" />
      <stop offset="75%" style="stop-color:#2c3e50;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:0.1" />
    </radialGradient>
    <linearGradient id="maybachLeather" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2c1810;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a2c1a;stop-opacity:1" />
    </linearGradient>
    <filter id="maybachInteriorGlow">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Ultra-luxury Maybach interior background -->
  <rect width="800" height="450" fill="url(#maybachInterior)"/>
  
  <!-- Galaxy starlight ceiling -->
  <path d="M0 150 Q400 100 800 150 L780 180 Q400 130 20 180 Z" fill="url(#galaxyStarlight)" opacity="0.9" filter="url(#maybachInteriorGlow)"/>
  
  <!-- Individual galaxy stars -->
  <circle cx="100" cy="120" r="2" fill="#ffffff" opacity="0.95"/>
  <circle cx="150" cy="115" r="1.5" fill="#f39c12" opacity="0.9"/>
  <circle cx="200" cy="125" r="2.5" fill="#9b59b6" opacity="0.85"/>
  <circle cx="250" cy="118" r="1" fill="#ffffff" opacity="0.92"/>
  <circle cx="300" cy="122" r="1.8" fill="#8e44ad" opacity="0.8"/>
  <circle cx="350" cy="116" r="2.2" fill="#ffffff" opacity="0.88"/>
  <circle cx="400" cy="120" r="1.5" fill="#4a90e2" opacity="0.82"/>
  <circle cx="450" cy="124" r="2" fill="#f39c12" opacity="0.9"/>
  <circle cx="500" cy="117" r="1.3" fill="#ffffff" opacity="0.94"/>
  <circle cx="550" cy="121" r="2.3" fill="#9b59b6" opacity="0.87"/>
  <circle cx="600" cy="115" r="1.7" fill="#8e44ad" opacity="0.78"/>
  <circle cx="650" cy="119" r="2.1" fill="#ffffff" opacity="0.91"/>
  <circle cx="700" cy="123" r="1.4" fill="#4a90e2" opacity="0.84"/>
  
