<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Black Mercedes Maybach First Class Interior">
  <defs>
    <linearGradient id="nappaLeather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fefce8;stop-opacity:1" /> <!-- Cream / Beige -->
      <stop offset="100%" style="stop-color:#fde047;stop-opacity:0.2" />
    </linearGradient>
    <radialGradient id="champagneGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#facc15;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#000;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="#1e1e1e"/>
  
  <!-- Cabin Walls -->
  <rect x="50" y="50" width="700" height="500" rx="10" fill="#2d2d2d"/>
  
  <!-- Wood Trim -->
  <rect x="50" y="150" width="700" height="20" fill="#451a03"/>
  <rect x="50" y="400" width="700" height="20" fill="#451a03"/>
  
  <!-- First Class Seats (Reclined) -->
  <path d="M150,200 L350,200 L380,500 L120,500 Z" fill="url(#nappaLeather)"/>
  <path d="M450,200 L650,200 L680,500 L420,500 Z" fill="url(#nappaLeather)"/>
  
  <!-- Quilted Stitching Pattern -->
  <path d="M150,250 L350,250 M150,300 L350,300 M150,350 L350,350" stroke="#d4d4d8" stroke-width="1" opacity="0.5"/>
  <path d="M450,250 L650,250 M450,300 L650,300 M450,350 L650,350" stroke="#d4d4d8" stroke-width="1" opacity="0.5"/>
  
  <!-- Center Console -->
  <rect x="360" y="200" width="80" height="300" fill="#111" stroke="#451a03" stroke-width="2"/>
  
  <!-- Champagne Fridge -->
  <rect x="370" y="350" width="60" height="80" fill="#000" stroke="#ccc"/>
  <path d="M390,360 L390,420 M410,360 L410,420" stroke="#facc15" stroke-width="3" opacity="0.8"/> <!-- Flutes -->
  <circle cx="400" cy="390" r="25" fill="url(#champagneGlow)" opacity="0.4"/>
  
  <!-- Fold-out Tables -->
  <path d="M250,350 L350,350 L330,400 L230,400 Z" fill="#fff" opacity="0.9"/>
  <path d="M550,350 L450,350 L470,400 L570,400 Z" fill="#fff" opacity="0.9"/>
  
  <!-- Ambient Lighting -->
  <rect x="50" y="50" width="700" height="5" fill="#a855f7" opacity="0.8"/> <!-- Purple Mood Light -->
</svg>