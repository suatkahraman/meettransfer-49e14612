  <path d="M160 290 Q190 230 260 230 L540 230 Q620 230 650 290 L670 350 L630 380 L180 380 L140 350 Z" fill="#0a0a0a" stroke="#f39c12" stroke-width="3"/>
  <path d="M180 240 Q210 210 290 210 L510 210 Q590 210 620 240 L610 290 L190 290 Z" fill="#2c3e50" opacity="0.8" stroke="#f39c12" stroke-width="2"/>
  
  <!-- Group silhouettes -->
  <rect x="240" y="195" width="35" height="60" fill="#2c3e50" rx="17"/>
  <rect x="285" y="200" width="30" height="55" fill="#2c3e50" rx="15"/>
