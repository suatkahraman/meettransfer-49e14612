<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vipVitoBusinessBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34495e;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="businessVipVitoLight" cx="30%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#9b59b6;stop-opacity:0.2" />
    </radialGradient>
    <radialGradient id="vipStarlightBusiness" cx="50%" cy="45%" r="85%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="25%" style="stop-color:#4a90e2;stop-opacity:0.7" />
      <stop offset="50%" style="stop-color:#9b59b6;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:0.2" />
    </radialGradient>
  </defs>
  
  <!-- Business VIP district background -->
  <rect width="800" height="450" fill="url(#vipVitoBusinessBg)"/>
  
  <!-- Modern office buildings -->
  <rect x="0" y="80" width="180" height="370" fill="#2c3e50" opacity="0.6"/>
  <rect x="220" y="60" width="160" height="390" fill="#34495e" opacity="0.7"/>
  <rect x="420" y="100" width="140" height="350" fill="#2c3e50" opacity="0.6"/>
  <rect x="620" y="70" width="180" height="380" fill="#34495e" opacity="0.7"/>
  
  <!-- Office windows -->
  <rect x="20" y="120" width="30" height="40" fill="#ffffff" opacity="0.8"/>
  <rect x="70" y="120" width="30" height="40" fill="#ffffff" opacity="0.8"/>
  <rect x="120" y="120" width="30" height="40" fill="#ffffff" opacity="0.8"/>
  <rect x="240" y="100" width="25" height="35" fill="#00d4ff" opacity="0.7"/>
  <rect x="280" y="100" width="25" height="35" fill="#00d4ff" opacity="0.7"/>
  <rect x="320" y="100" width="25" height="35" fill="#00d4ff" opacity="0.7"/>
  
  <!-- Business VIP Mercedes Vito -->
  <path d="M160 290 Q190 220 270 220 L530 220 Q610 220 640 290 L660 350 L620 390 L170 390 L130 350 Z" fill="#030303" stroke="#4a90e2" stroke-width="4"/>
  <path d="M180 230 Q210 190 300 190 L500 190 Q610 190 640 230 L630 290 L180 290 Z" fill="url(#vipStarlightBusiness)" stroke="#9b59b6" stroke-width="3"/>
  
  <!-- Business VIP professional chauffeur -->
  <rect x="320" y="200" width="50" height="70" fill="#2c3e50" rx="25"/>
  <circle cx="345" cy="190" r="18" fill="#34495e"/>
  
  <!-- Office building lighting -->
  <circle cx="200" cy="180" r="35" fill="url(#businessVipVitoLight)" opacity="0.5"/>
  
  <!-- Large VIP Vito wheels -->
  <circle cx="240" cy="390" r="35" fill="#2c3e50" stroke="#7f8c8d" stroke-width="5"/>
  <circle cx="580" cy="390" r="35" fill="#2c3e50" stroke="#7f8c8d" stroke-width="5"/>
  <circle cx="240" cy="390" r="21" fill="#34495e"/>
  <circle cx="580" cy="390" r="21" fill="#34495e"/>
  
  <!-- Executive VIP Vito headlights -->
  <ellipse cx="610" cy="270" rx="16" ry="9" fill="#ffffff" opacity="0.9"/>
  <ellipse cx="230" cy="270" rx="13" ry="7" fill="#ff6b35" opacity="0.8"/>
  
  <!-- VIP starlight LED strips -->
  <rect x="590" y="260" width="35" height="4" fill="#ffffff" opacity="0.8"/>
  <rect x="215" y="260" width="28" height="4" fill="#ff6b35" opacity="0.8"/>
  
  <!-- Ground reflection -->
  <ellipse cx="400" cy="400" rx="300" ry="20" fill="#4a90e2" opacity="0.1"/>
  
  <!-- Business VIP service elements -->
  <rect x="350" y="320" width="100" height="35" fill="#9b59b6" opacity="0.4" rx="8"/>
  <text x="400" y="345" font-family="Arial" font-size="14" fill="#ffffff" text-anchor="middle">VIP EXECUTIVE</text>
  
  <!-- SEO Alt Text: Futuristic Mercedes VIP Vito minivan business transfer with starlight ceiling and premium executive chauffeur -->
</svg>