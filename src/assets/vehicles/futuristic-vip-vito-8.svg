  <!-- VIP group service elements -->
  <rect x="350" y="320" width="100" height="40" fill="#8e44ad" opacity="0.4" rx="8"/>
  <text x="400" y="348" font-family="Arial" font-size="16" fill="#ffffff" text-anchor="middle">VIP GROUP</text>
  
  <!-- SEO Alt Text: Futuristic Mercedes VIP Vito minivan group transfer with starlight ceiling and premium leather interior for 5 passengers -->
