<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vipVitoGroupBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="groupVipVitoLight" cx="50%" cy="60%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#9b59b6;stop-opacity:0.3" />
    </radialGradient>
    <radialGradient id="vipStarlightGroup" cx="50%" cy="45%" r="90%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="20%" style="stop-color:#9b59b6;stop-opacity:0.8" />
      <stop offset="40%" style="stop-color:#8e44ad;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#4a90e2;stop-opacity:0.3" />
    </radialGradient>
  </defs>
  
  <!-- VIP group travel background -->
  <rect width="800" height="450" fill="url(#vipVitoGroupBg)"/>
  
  <!-- VIP group atmosphere elements -->
  <circle cx="200" cy="160" r="60" fill="url(#groupVipVitoLight)" opacity="0.5"/>
  <circle cx="600" cy="180" r="55" fill="url(#groupVipVitoLight)" opacity="0.4"/>
  
  <!-- Futuristic Mercedes VIP Vito for group -->
  <path d="M150 290 Q180 220 260 220 L540 220 Q620 220 650 290 L670 350 L630 400 L160 400 L120 350 Z" fill="#010101" stroke="#9b59b6" stroke-width="5"/>
  <path d="M170 230 Q200 180 300 180 L500 180 Q640 180 670 230 L660 290 L170 290 Z" fill="url(#vipStarlightGroup)" stroke="#8e44ad" stroke-width="4"/>
  
  <!-- VIP group silhouettes -->
  <rect x="240" y="195" width="40" height="65" fill="#2c3e50" rx="20"/>
  <rect x="290" y="200" width="35" height="60" fill="#2c3e50" rx="17"/>
  <rect x="335" y="198" width="32" height="63" fill="#2c3e50" rx="16"/>
  <rect x="380" y="202" width="36" height="58" fill="#2c3e50" rx="18"/>
  <rect x="430" y="196" width="30" height="66" fill="#2c3e50" rx="15"/>
  <rect x="475" y="199" width="33" height="62" fill="#2c3e50" rx="16"/>
  <circle cx="260" cy="185" r="16" fill="#34495e"/>
  <circle cx="307" cy="187" r="14" fill="#34495e"/>
  <circle cx="351" cy="185" r="13" fill="#34495e"/>
  <circle cx="398" cy="189" r="15" fill="#34495e"/>
  <circle cx="445" cy="186" r="12" fill="#34495e"/>
  <circle cx="491" cy="188" r="14" fill="#34495e"/>
  
  <!-- VIP group ambient lighting -->
  <rect x="0" y="320" width="800" height="6" fill="#ffffff" opacity="0.8"/>
  <rect x="0" y="380" width="800" height="4" fill="#8e44ad" opacity="0.6"/>
  
  <!-- Large VIP Vito wheels -->
  <circle cx="240" cy="400" r="40" fill="#2c3e50" stroke="#7f8c8d" stroke-width="6"/>
  <circle cx="580" cy="400" r="40" fill="#2c3e50" stroke="#7f8c8d" stroke-width="6"/>
  <circle cx="240" cy="400" r="24" fill="#34495e"/>
  <circle cx="580" cy="400" r="24" fill="#34495e"/>
  
  <!-- VIP group headlights -->
  <ellipse cx="620" cy="270" rx="18" ry="10" fill="#ffffff" opacity="0.95"/>
  <ellipse cx="230" cy="270" rx="15" ry="8" fill="#ff6b35" opacity="0.8"/>
  
  <!-- VIP starlight group strips -->
  <rect x="600" y="260" width="40" height="4" fill="#ffffff" opacity="0.9"/>
  <rect x="215" y="260" width="32" height="4" fill="#ff6b35" opacity="0.8"/>
  
