<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Black VIP Mercedes Vito Exterior">
  <defs>
    <linearGradient id="vipBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f0f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="privacyGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#111;stop-opacity:0.9" />
    </linearGradient>
    <filter id="vipGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <rect width="800" height="600" fill="#f1f5f9"/>
  
  <!-- VIP Body Shape -->
  <path d="M80,350 L140,240 L660,240 L720,350 L720,460 L80,460 Z" fill="url(#vipBody)"/>
  
  <!-- Tinted Windows -->
  <path d="M160,250 L300,250 L300,340 L150,340 Z" fill="url(#privacyGlass)"/>
  <path d="M320,250 L640,250 L650,340 L320,340 Z" fill="url(#privacyGlass)"/>
  
  <!-- Chrome Trim -->
  <path d="M80,420 L720,420" stroke="#ccc" stroke-width="3"/>
  <rect x="320,450" width="160" height="10" fill="#111"/> <!-- Step -->

  <!-- Wheels -->
  <circle cx="180" cy="460" r="45" fill="#111" stroke="#ccc" stroke-width="2"/>
  <circle cx="620" cy="460" r="45" fill="#111" stroke="#ccc" stroke-width="2"/>
  
  <!-- Rims -->
  <circle cx="180" cy="460" r="30" fill="none" stroke="#ccc" stroke-width="5" stroke-dasharray="10,5"/>
  <circle cx="620" cy="460" r="30" fill="none" stroke="#ccc" stroke-width="5" stroke-dasharray="10,5"/>
  
  <!-- Headlights -->
  <path d="M700,360 L720,360 L715,390 L700,390 Z" fill="#fff" filter="url(#vipGlow)"/>
  <path d="M80,360 L100,360 L105,390 L85,390 Z" fill="#ef4444" opacity="0.9"/>
</svg>