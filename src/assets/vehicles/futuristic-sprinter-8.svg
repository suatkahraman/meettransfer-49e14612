<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Mercedes Sprinter VIP Luxury Transport with Premium Features">
  <title>Mercedes Sprinter VIP Luxury Transport</title>
  <desc>Ultra-luxury Mercedes Sprinter minibus with VIP amenities, premium leather seats, champagne service, and exclusive features</desc>
  
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="sprinterVIP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="sprinterPremium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d2d2d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#404040;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="sprinterChampagne" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="sprinterVIPStar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fbbf24;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.3" />
    </radialGradient>
    
    <filter id="sprinterVIPGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="#0a0a0a"/>
  
  <!-- Luxury estate background -->
  <g transform="translate(50,100)" opacity="0.4">
    <rect x="0" y="400" width="250" height="300" fill="#1f2937" stroke="#374151" stroke-width="2"/>
    <polygon points="0,400 125,350 250,400" fill="#4b5563"/>
    <rect x="30" y="450" width="40" height="40" fill="#6b7280"/>
    <rect x="80" y="470" width="35" height="35" fill="#6b7280"/>
    <rect x="130" y="460" width="45" height="45" fill="#6b7280"/>
    <rect x="190" y="480" width="30" height="30" fill="#6b7280"/>
    <text x="125" y="550" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#60a5fa">LÜKS REZİDANS</text>
  </g>
  
  <!-- VIP Mercedes Sprinter -->
  <g transform="translate(200,250)">
    <!-- Main vehicle -->
    <rect x="0" y="0" width="750" height="220" rx="30" fill="url(#sprinterVIP)" stroke="#6b7280" stroke-width="4"/>
    <rect x="0" y="-15" width="180" height="250" rx="35" fill="url(#sprinterVIP)" stroke="#6b7280" stroke-width="4"/>
    
    <!-- Extended VIP section -->
    <rect x="520" y="15" width="230" height="190" rx="25" fill="url(#sprinterVIP)" stroke="#6b7280" stroke-width="3"/>
    
    <!-- VIP branding -->
    <rect x="200" y="30" width="350" height="40" rx="20" fill="url(#sprinterPremium)" stroke="#fbbf24" stroke-width="3"/>
    <text x="375" y="55" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#fbbf24">VIP TRANSFER</text>
    
    <!-- Premium leather seats -->
    <g transform="translate(100,120)">
      <rect x="0" y="0" width="80" height="90" rx="12" fill="url(#sprinterPremium)" stroke="#6b7280" stroke-width="3"/>
      <rect x="100" y="0" width="80" height="90" rx="12" fill="url(#sprinterPremium)" stroke="#6b7280" stroke-width="3"/>
      <rect x="200" y="0" width="80" height="90" rx="12" fill="url(#sprinterPremium)" stroke="#6b7280" stroke-width="3"/>
      <rect x="300" y="0" width="80" height="90" rx="12" fill="url(#sprinterPremium)" stroke="#6b7280" stroke-width="3"/>
      <rect x="400" y="0" width="80" height="90" rx="12" fill="url(#sprinterPremium)" stroke="#6b7280" stroke-width="3"/>
    </g>
    
    <!-- VIP amenities console -->
    <rect x="150" y="70" width="450" height="40" rx="20" fill="url(#sprinterPremium)" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="200" cy="90" r="12" fill="#fbbf24"/>
    <circle cx="250" cy="90" r="12" fill="#fbbf24"/>
    <circle cx="300" cy="90" r="12" fill="#fbbf24"/>
    <circle cx="350" cy="90" r="12" fill="#fbbf24"/>
    <circle cx="400" cy="90" r="12" fill="#fbbf24"/>
    <circle cx="450" cy="90" r="12" fill="#fbbf24"/>
    <circle cx="500" cy="90" r="12" fill="#fbbf24"/>
    
    <!-- Panoramic VIP windows -->
    <polygon points="30,40 160,40 170,120 20,120" fill="#1f2937" stroke="#fbbf24" stroke-width="3"/>
    <rect x="200" y="40" width="90" height="90" fill="#1f2937" stroke="#fbbf24" stroke-width="3"/>
    <rect x="310" y="40" width="90" height="90" fill="#1f2937" stroke="#fbbf24" stroke-width="3"/>
    <rect x="420" y="40" width="90" height="90" fill="#1f2937" stroke="#fbbf24" stroke-width="3"/>
    <rect x="530" y="40" width="90" height="90" fill="#1f2937" stroke="#fbbf24" stroke-width="3"/>
    <rect x="640" y="40" width="90" height="90" fill="#1f2937" stroke="#fbbf24" stroke-width="3"/>
    
    <!-- Diamond LED headlights -->
    <circle cx="60" cy="80" r="25" fill="#ffffff" filter="url(#sprinterVIPGlow)"/>
    <circle cx="130" cy="80" r="25" fill="#ffffff" filter="url(#sprinterVIPGlow)"/>
    <polygon points="60,55 65,70 60,85 55,70" fill="#fbbf24"/>
    <polygon points="130,55 135,70 130,85 125,70" fill="#fbbf24"/>
    
    <!-- Premium wheels -->
    <circle cx="150" cy="190" r="45" fill="#374151" stroke="#6b7280" stroke-width="4"/>
    <circle cx="350" cy="190" r="45" fill="#374151" stroke="#6b7280" stroke-width="4"/>
    <circle cx="550" cy="190" r="45" fill="#374151" stroke="#6b7280" stroke-width="4"/>
    
    <!-- Mercedes VIP emblem -->
    <circle cx="90" cy="50" r="18" fill="#e5e7eb"/>
    <path d="M90,32 L90,68 M72,50 L108,50" stroke="#1f2937" stroke-width="3"/>
    <text x="90" y="52" font-family="Arial, sans-serif" font-size="8" font-weight="bold" text-anchor="middle" fill="#1f2937">VIP</text>
  </g>
  
  <!-- VIP amenities -->
  <g transform="translate("translate(950,350)">
    <!-- Champagne service -->
    <rect x="0" y="0" width="160" height="120" rx="20" fill="url(#sprinterPremium)" stroke="#fbbf24" stroke-width="3"/>
    <rect x="20" y="20" width="120" height="80" rx="15" fill="url(#sprinterChampagne)" stroke="#f59e0b" stroke-width="2"/>
    <rect x="40" y="40" width="20" height="40" rx="10" fill="#ffffff"/>
    <rect x="70" y="40" width="20" height="40" rx="10" fill="#ffffff"/>
    <rect x="100" y="40" width="20" height="40" rx="10" fill="#ffffff"/>
    <text x="80" y="110" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#fbbf24">ŞAMPANYA</text>
    
    <!-- Climate control -->
    <rect x="180" y="0" width="120" height="80" rx="15" fill="url(#sprinterPremium)" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="240" cy="25" r="12" fill="#60a5fa"/>
    <text x="240" y="50" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#60a5fa">İKLİM</text>
    <text x="240" y="65" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#60a5fa">KONTROL</text>
  </g>
  
  <!-- VIP capacity indicator -->
  <g transform="translate(500,500)">
    <rect x="0" y="0" width="200" height="50" rx="25" fill="url(#sprinterPremium)" stroke="#fbbf24" stroke-width="3"/>
    <text x="100" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#fbbf24">VIP 12 Kişi</text>
  </g>
  
  <!-- VIP starlight ceiling effect -->
  <g opacity="0.7">
    <circle cx="300" cy="150" r="2" fill="url(#sprinterVIPStar)"/>
    <circle cx="450" cy="120" r="2" fill="url(#sprinterVIPStar)"/>
    <circle cx="600" cy="140" r="2" fill="url(#sprinterVIPStar)"/>
    <circle cx="750" cy="130" r="2" fill="url(#sprinterVIPStar)"/>
    <circle cx="900" cy="160" r="2" fill="url(#sprinterVIPStar)"/>
    <circle cx="350" cy="180" r="2" fill="url(#sprinterVIPStar)"/>
    <circle cx="500" cy="110" r="2" fill="url(#sprinterVIPStar)"/>
    <circle cx="650" cy="170" r="2" fill="url(#sprinterVIPStar)"/>
    <circle cx="800" cy="125" r="2" fill="url(#sprinterVIPStar)"/>
    <circle cx="950" cy="145" r="2" fill="url(#sprinterVIPStar)"/>
  </g>
  
  <!-- VIP premium lighting effects -->
  <g opacity="0.5">
    <circle cx="600" cy="400" r="150" fill="none" stroke="#fbbf24" stroke-width="4" opacity="0.2">
      <animate attributeName="r" values="150;200;150" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.05;0.2" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>